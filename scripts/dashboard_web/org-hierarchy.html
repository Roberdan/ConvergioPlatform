<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Org Hierarchy</title>
  <style>
    :root{--bg:#0b1020;--panel:#121a30;--text:#eef2ff;--muted:#9ea9cc;--ok:#48dcb0;--warn:#ffad5a;--err:#ff6f89;--line:#273259}
    body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 Inter,system-ui}
    header{display:flex;gap:12px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
    #tree,#detail{padding:12px} #wrap{display:grid;grid-template-columns:1fr 320px;height:calc(100vh - 52px)}
    ul{list-style:none;padding-left:18px;border-left:1px dashed #33457c}.node{cursor:pointer;display:flex;gap:8px;align-items:center;padding:4px 0}
    .badge{padding:1px 7px;border-radius:10px;font-size:11px}.active{background:rgba(72,220,176,.2);color:var(--ok)}
    .idle{background:rgba(255,173,90,.2);color:var(--warn)} .suspended{background:rgba(255,111,137,.2);color:var(--err)}
    .pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 rgba(72,220,176,.6);animation:pulse 1.6s infinite}
    .new{animation:flash 1s ease 1} #detail{border-left:1px solid var(--line);overflow:auto} small{color:var(--muted)}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(72,220,176,.6)}100%{box-shadow:0 0 0 8px rgba(72,220,176,0)}}
    @keyframes flash{0%{background:#2f5acc}100%{background:transparent}}
  </style>
</head>
<body>
  <header>
    <strong>Vista 2 · Org Hierarchy</strong>
    <label>Org <select id="org"></select></label>
    <small>Data: <code>/api/orgs</code> · Events: <code>/ws/brain</code></small>
  </header>
  <div id="wrap"><div id="tree"></div><aside id="detail"><h3>Agent detail</h3><p>Select an agent node.</p></aside></div>
  <script>
    const orgSel=document.getElementById('org'),tree=document.getElementById('tree'),detail=document.getElementById('detail');
    const state={orgs:[],events:[],expanded:new Set(),fresh:new Set()};
    const badge=s=>`<span class="badge ${s==='active'?'active':s==='suspended'?'suspended':'idle'}">${(s||'idle').toUpperCase()}</span>`;
    const byDept=(agents=[])=>agents.reduce((m,a)=>((m[a.department||'General']??=[]).push(a),m),{});
    const li=(a)=>`<li class="node ${state.fresh.has(a.id)?'new':''}" data-id="${a.id}"><span class="pulse"></span><b>${a.name||a.id}</b><small>${a.role||'member'}</small>${badge(a.status)}</li>`;
    function render(){
      const org=state.orgs.find(o=>o.id===orgSel.value)||state.orgs[0]; if(!org){tree.innerHTML='<p>No orgs yet.</p>';return;}
      const depts=byDept(org.members||org.agents||[]);
      const html=[`<h3>${org.name||org.id}</h3><small>CEO: ${(org.ceo&&org.ceo.name)||org.ceo_id||'n/a'}</small><ul>`];
      for(const [d,arr] of Object.entries(depts)){const open=state.expanded.has(d); html.push(`<li><div class="node" data-dept="${d}">📁 <b>${d}</b> <small>${arr.length}</small></div>${open?`<ul>${arr.map(li).join('')}</ul>`:''}</li>`);}
      html.push('</ul>'); tree.innerHTML=html.join('');
    }
    function showAgent(id){
      const ev=state.events.filter(e=>[e.from,e.to,e.agent_id,e.id].includes(id)).slice(-12).reverse();
      detail.innerHTML=`<h3>${id}</h3><p>Recent messages & decisions</p>${ev.map(e=>`<article><small>${new Date(e.ts||Date.now()).toLocaleTimeString()}</small><pre>${JSON.stringify(e,null,2)}</pre></article>`).join('')||'<p>No events yet.</p>'}`;
    }
    tree.onclick=e=>{const d=e.target.closest('[data-dept]'),a=e.target.closest('[data-id]'); if(d){const k=d.dataset.dept;state.expanded.has(k)?state.expanded.delete(k):state.expanded.add(k); render();} if(a)showAgent(a.dataset.id);};
    async function load(){
      const res=await fetch('/api/orgs'); const data=await res.json(); state.orgs=data.orgs||data||[];
      orgSel.innerHTML=state.orgs.map(o=>`<option value="${o.id}">${o.name||o.id}</option>`).join(''); render();
    }
    orgSel.onchange=render; load().catch(()=>tree.innerHTML='<p>Unable to load /api/orgs</p>');
    const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/brain');
    ws.onmessage=e=>{const m=JSON.parse(e.data||'{}'); state.events.push(m); if(m.type==='org_update'){load(); if(m.org_id)state.fresh.add(m.org_id);}
      if(m.type==='agent_factory'&&m.agent_id){state.fresh.add(m.agent_id); load();} if(m.type==='org_message')render();
      setTimeout(()=>state.fresh.clear(),1200);
    };
  </script>
</body>
</html>
