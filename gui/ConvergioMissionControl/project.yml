name: ConvergioMissionControl
options:
  bundleIdPrefix: com.convergio
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.0"
settings:
  SWIFT_VERSION: "5.9"
  MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  ConvergioMissionControl:
    type: application
    platform: macOS
    sources:
      - path: ConvergioMissionControl
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.convergio.missioncontrol
      INFOPLIST_KEY_LSUIElement: true
      INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
      INFOPLIST_KEY_CFBundleDisplayName: "Convergio Mission Control"
      GENERATE_INFOPLIST_FILE: true
      MARKETING_VERSION: "18.3.0"
      CURRENT_PROJECT_VERSION: 1
      CODE_SIGN_STYLE: Automatic
      PRODUCT_NAME: "ConvergioMissionControl"
    info:
      path: Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: "Convergio Mission Control"
        LSMinimumSystemVersion: "14.0"
  DaemonClientTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/DaemonClientTests
    dependencies:
      - target: ConvergioMissionControl
