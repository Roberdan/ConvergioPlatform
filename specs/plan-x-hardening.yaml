        ref: [F-07, F-08]
        do: |
          Unify delegation into ONE flow. Fix S4: cvg delegation CLI.

          1. Add CLI commands to daemon/src/cli_delegation.rs:
             cvg delegation start <plan_id> --peer <peer> [--wave <wave_id>]
             cvg delegation cancel <plan_id>
             Wire into main.rs CLI dispatch.

          2. POST /api/mesh/delegate must:
             - Resolve peer via peer_resolver (from W2)
             - rsync working files
             - Write prompt with full Thor workflow (from W1 T1-03)
             - Launch in Convergio tmux session
             - Propagate git credentials (gh auth token via SSH)
             - Propagate Telegram/HF tokens via ~/.convergio/env

          3. Per-task IPC callback (S10):
             The completion script (done_script) should POST progress
             to coordinator /api/delegation/{plan_id}/progress after EACH task,
             not just at the end.

          All 3 existing delegation paths (sse_delegate, executor, bash script)
          must call the same core function.
          Working dir: /Users/Roberdan/GitHub/ConvergioPlatform
        type: feature
