# Plan X — Convergio Hardening
# Fix ALL bugs, mesh issues, delegation workflow, DX, documentation.
# Based on improvement report (28 March 2026) + session backlog.
# 30 issues consolidated into 5 waves, 15 tasks.

name: "Plan X — Convergio Hardening"
project_id: convergio
priority: P0
execution_mode: serial
tags: [hardening, bugs, mesh, delegation, dx, documentation]

description: >
  Fix 9 confirmed bugs (2 P0, 4 P1, 2 P2), unify delegation workflow,
  improve developer experience, close all documentation gaps.
  Consolidates improvement report from Plan 738 sessions + session backlog.

requirements:
  - F-01: "cvg review register works on spec-file before plan creation"
  - F-02: "coordinator/emit works without CRDT extension"
  - F-03: "delegated agents execute Thor validation per wave"
  - F-04: "daemon binds on 0.0.0.0 or Tailscale IP (reachable from mesh)"
  - F-05: "centralized peer resolver with fallback chain"
  - F-06: "/api/channels and /api/health/deep wired in router"
  - F-07: "cvg delegation start/status/cancel CLI complete"
  - F-08: "one unified delegation flow (API + CLI + orchestrator)"
  - F-09: "spec YAML schema documented with cvg plan template"
  - F-10: "all documentation gaps closed (D1-D7)"
  - F-11: "invoke_agent MCP tool functional"
  - F-12: "full E2E test on M1 Pro passes"

acceptance_invariants:
  - description: "review register on spec-file works"
    verify: "cargo test --features kernel --manifest-path daemon/Cargo.toml --lib -- cli_review"
    defined_by: user
  - description: "coordinator emit does not crash"
    verify: "cargo test --manifest-path daemon/Cargo.toml --lib -- coordinator"
    defined_by: user
  - description: "daemon reachable from other mesh nodes"
    verify: "grep -q '0.0.0.0\\|tailscale' daemon/src/server/routes/mod.rs || grep -q 'bind.*0.0.0.0' daemon/start.sh"
    defined_by: user

# ─────────────────────────────────────────────────────────────────────────────
# WAVE 1: P0 Blockers — review, CRDT, Thor delegation
# ─────────────────────────────────────────────────────────────────────────────

waves:
  - id: W1
    name: "P0 Blockers"
    merge_mode: sync
    tasks:
      - id: T1-01
        ref: [F-01]
        do: |
          Fix B1: cvg review register --spec-file crashes with NOT NULL plan_id.

          The workflow should be: write spec → review spec → fix → create plan.
          But review register requires plan_id which doesn't exist yet.

          Fix in daemon/src/cli_review.rs (or api_plan_db_review.rs):
          Allow plan_id=0 or NULL when --spec-file is provided.
          The review is on the SPEC, not the plan.
          Store spec_file path in plan_reviews table (column already exists).
          When plan is later created, link reviews by spec_file path.

          Also fix S7: allow pre-plan review workflow.
          Working dir: /Users/Roberdan/GitHub/ConvergioPlatform
        type: fix
        output_type: pr
        model: claude-opus-4-6
        executor_agent: task-executor
        validator_agent: thor-quality-assurance-guardian
        effort: 2
        verify:
          - "cargo check --manifest-path daemon/Cargo.toml"
          - "cargo test --manifest-path daemon/Cargo.toml --lib -- review"

      - id: T1-02
        ref: [F-02]
        do: |
          Fix B5: coordinator/emit CRDT error (crsql_internal_sync_bit missing).

          The coordinator cannot emit events because the CRDT extension
          is not loaded (crsqlite.dylib missing on some nodes).

          Fix: guard ALL crsqlite-dependent code with a runtime check.
          If crsqlite not loaded, skip CRDT operations and use plain SQLite.
          The coordinator must work WITHOUT CRDT — CRDT is an optimization, not a requirement.

          Primary fix target: daemon/src/db/crdt/sync.rs (lines 15/42/57/74 query crsql_changes).
          Also check daemon/src/db/ for crsqlite load paths.
          Add: fn crdt_available(conn) -> bool { conn.query_row("SELECT 1 FROM crsql_changes LIMIT 0", ...).is_ok() }
          Guard all CRDT calls with this check.
          Working dir: /Users/Roberdan/GitHub/ConvergioPlatform
        type: fix
        output_type: pr
        model: claude-opus-4-6
        executor_agent: task-executor
        validator_agent: thor-quality-assurance-guardian
        effort: 3
        verify:
          - "cargo check --manifest-path daemon/Cargo.toml"
          - "cargo test --manifest-path daemon/Cargo.toml --lib -- coordinator"

      - id: T1-03
        ref: [F-03]
        do: |
          Fix: delegated agents don't execute Thor validation.

          In daemon/src/orchestrator/executor.rs, build_plan_prompt() generates
          a generic prompt. It must include the full Convergio workflow:

          1. For each task in the plan:
             - cvg task update <id> in_progress
             - Execute the task (code/docs/etc)
             - Run ALL verify[] commands from the spec
             - cvg task update <id> submitted "summary"
          2. After all tasks in a wave:
             - cvg plan validate <plan_id>
          3. After all waves:
             - cvg plan complete <plan_id>
          4. Send Telegram notification on completion

          Read the current build_plan_prompt() and extend it.
          Include verify[] commands from the spec YAML (parse from DB tasks.test_criteria).
          Working dir: /Users/Roberdan/GitHub/ConvergioPlatform
        type: fix
        output_type: pr
        model: claude-opus-4-6
        executor_agent: task-executor
        validator_agent: thor-quality-assurance-guardian
        effort: 3
        verify:
          - "grep -q 'cvg task update' daemon/src/orchestrator/executor.rs"
          - "grep -q 'cvg plan validate' daemon/src/orchestrator/executor.rs"
          - "cargo check --manifest-path daemon/Cargo.toml"

  # ─────────────────────────────────────────────────────────────────────────
  # WAVE 2: Mesh Fixes — binding, peer resolver, missing routes
  # ─────────────────────────────────────────────────────────────────────────

  - id: W2
    name: "Mesh Fixes"
    merge_mode: sync
    tasks:
      - id: T2-01
        ref: [F-04, F-05]
        do: |
          Fix B7: daemon binds 127.0.0.1 — unreachable from mesh.
          Fix B6: /api/mesh/exec SSH doesn't resolve peers.
          Fix B9: centralized peer resolver.

          1. daemon/start.sh or serve command: bind 0.0.0.0:8420 ONLY in dev-mode.
             Production keeps 127.0.0.1. Add --bind-all flag gated behind --dev-mode.
             Verify: non-dev-mode must NOT bind 0.0.0.0.

          2. Create daemon/src/mesh/peer_resolver.rs:
             pub fn resolve_peer(name: &str, peers_conf: &str) -> PeerAddress
             Fallback chain: SSH config alias → Tailscale IP → LAN IP → Thunderbolt → DNS
             Read from peers.conf: ssh_alias, tailscale_ip, thunderbolt_ip, dns_name
             Return the FIRST that responds to ping/SSH probe

          3. Update /api/mesh/exec to use peer_resolver instead of raw hostname
          4. Update delegate_to_peer() to use peer_resolver
          Working dir: /Users/Roberdan/GitHub/ConvergioPlatform
        type: fix
        output_type: pr
        model: claude-opus-4-6
        executor_agent: task-executor
        validator_agent: thor-quality-assurance-guardian
        effort: 3
        verify:
          - "test -f daemon/src/mesh/peer_resolver.rs"
          - "grep -q 'resolve_peer\\|PeerAddress' daemon/src/mesh/peer_resolver.rs"
          - "cargo check --manifest-path daemon/Cargo.toml"

      - id: T2-02
        ref: [F-06]
        do: |
          Fix B2: /api/channels not mounted. Fix B3: /api/health/deep not mounted.
          Fix B4: cvg delegation status 404 (ID mismatch). Fix B8: plan tree no wave names.

          1. Wire api_channels.rs into routes/mod.rs (add use + merge)
          2. Wire api_health_deep.rs into routes/mod.rs (add use + merge)
          3. Fix delegation progress endpoint: align plan_id vs delegation_id
          4. Fix cvg plan tree: include wave_id and wave_name in output
          Working dir: /Users/Roberdan/GitHub/ConvergioPlatform
        type: fix
        output_type: pr
        model: claude-opus-4-6
        executor_agent: task-executor
        validator_agent: thor-quality-assurance-guardian
        effort: 2
        verify:
