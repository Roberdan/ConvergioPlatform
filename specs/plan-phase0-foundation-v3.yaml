# Plan Phase 0 — Foundation & Resilient Ecosystem (v3)
# Prerequisite for ALL 711 sub-plans (712-721).
# Covers: F-01..F-08, F-11. Progressive: each wave builds on the previous.
# Post-review revision incorporating vision docs, VirtualBPM issues, HPC directives.

name: "Phase 0 — Foundation & Resilient Ecosystem"
project: convergio
version: "18.0.0"
constitution-version: "3.0.0"
parallel_mode: standard

requirements:
  - "F-01: Constitution v3.0.0 — resilience + swarm as NON-NEGOTIABLE articles (Article XI Resilience, Article XII Swarm Intelligence)"
  - "F-02: Repo split — ConvergioPlatform → convergio-daemon, convergio-app, convergio-web, convergio (meta)"
  - "F-03: Naming — MyConvergio→convergio-community, MaranelloLuceDesign→maranello-design (mesh→swarm deferred to Plan 720)"
  - "F-04: OpenAPI 3.1 spec — versioned contract in convergio meta repo"
  - "F-05: Fix 4 VirtualBPM issues — review CLI, import types, chicken-egg, SQLite WAL locking"
  - "F-06: Resilience framework — circuit breakers, retry with exponential backoff, checkpoint/restart, graceful degradation"
  - "F-07: Agent IPC optimization — MessagePack (rmp-serde) replacing JSON for inter-agent communication"
  - "F-08: Zero-zombie enforcement — reaper for worktrees/branches/processes, auto-cleanup hooks"
  - "F-11: Multi-repo orchestration — repositories table, cvg repo CLI, cross-project plan dependencies"
  - "F-26: Local LLM kernel — always-on local model (Ollama/MLX) as watchdog: monitors health, restarts crashes, sends phone notifications, survives cloud API failures"
  - "F-27: Decision audit trail — log all reasoning (first principles, Socratic) in DB for post-hoc review"
  - "F-28: Phone notifications — ntfy.sh/Telegram integration for critical events (agent blocked, crash, wave complete)"
  - "F-29: Self-verification — every action produces automatic verification before reporting done. No self-reported success."

