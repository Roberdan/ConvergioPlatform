# ─────────────────────────────────────────────────────────────────────────────
# WAVE 1: Quick Fixes + Constitution (unblocks everything)
# Fix VirtualBPM bugs, update Constitution, fix remaining >250-line file.
# These are prerequisites: the rest of the plan uses cvg CLI + DB.
# ─────────────────────────────────────────────────────────────────────────────
waves:
  - id: W1
    name: "Quick Fixes + Constitution"
    theme: "Fix CLI/DB bugs, update Constitution with resilience/swarm, fix file limits"
    merge_mode: sync
    tasks:
      - id: T1-01
        title: |
          Fix 4 VirtualBPM bugs in daemon CLI/DB layer.
          Working dir: /Users/Roberdan/GitHub/ConvergioPlatform

          BUG 1 — cvg review register misleading parameter order:
          Current: cvg review register <plan_id> <reviewer> <verdict> [--suggestions]
          Fix: make parameter names explicit in --help output. Add validation
          that verdict is one of: proceed|revise|reject. Show error with correct
          usage if wrong order detected.
          File: daemon/src/cli_review.rs

          BUG 2 — cvg plan import rejects valid task types:
          Current CHECK constraint: bug|feature|fix|refactor|test|config|documentation|chore|doc
          Missing types needed: pr, research, strategy, design, legal, analysis, planning, communication
          Add ALL missing types to the CHECK constraint.
          Add migration in daemon/src/server/state_init_migrations.rs (MIGRATIONS array).
          Must recreate CHECK via new migration (SQLite doesn't support ALTER CHECK).

          BUG 3 — Review workflow chicken-and-egg:
          Problem: review register requires plan_id but review should happen before plan create.
          Fix: allow cvg review register with --spec-file <path> instead of plan_id.
          Store review linked to spec file path. cvg plan create then finds and links
          the review automatically by source_file match.
          Files: daemon/src/cli_review.rs, daemon/src/server/api_plan_db_review.rs

          BUG 4 — SQLite "database is locked" during parallel agents:
          NOTE: WAL mode + busy_timeout=5000 ALREADY exist in daemon/src/db/mod.rs.
          What's missing: retry with exponential backoff for SQLITE_BUSY errors.
          Add retry wrapper: 3 attempts, 100ms/500ms/2000ms with jitter.
          Apply to ALL write operations in daemon/src/db/queries.rs and service.rs.
          Use the resilience::retry module if W2 is done, otherwise inline.
          Files: daemon/src/db/mod.rs, daemon/src/db/queries.rs, daemon/src/db/service.rs

          TDD: write failing test for each bug FIRST, then fix.
          Run: cargo check && cargo test after ALL fixes.
        type: fix
        output_type: pr
        model: claude-opus-4-6
        executor_agent: task-executor
        validator_agent: thor-quality-assurance-guardian
        effort: 3
        verify:
          - "cd daemon && cargo check"
          - "cd daemon && cargo test"
          - "cd daemon && cargo test review"
          - "cd daemon && cargo test import"

      - id: T1-02
        title: |
          Fix chat_render.rs (254 lines → ≤250) and verify TUI test fix.
          Working dir: /Users/Roberdan/GitHub/ConvergioPlatform

          1. Read daemon/src/tui/views/chat_render.rs (currently 254 lines).
          2. Extract 4+ lines into a helper function or separate small module.
          3. Verify daemon/tests/tui_integration.rs has correct render_view() signature
             (15 params including chat_scroll: u16 and expanded_masters: &[i64]).
             A prior Claude fixed this — VERIFY it, don't redo.
          4. cargo check && cargo test (full suite, not just tui).
        type: refactor
        output_type: pr
        model: gpt-5.3-codex
        executor_agent: task-executor
        validator_agent: thor-quality-assurance-guardian
        effort: 1
        verify:
          - "wc -l < daemon/src/tui/views/chat_render.rs | awk '{if($1>250) exit 1}'"
          - "cd daemon && cargo test tui_integration"
          - "cd daemon && cargo test"

      - id: T1-03
        title: |
          Update CONSTITUTION.md to v3.0.0 with resilience + swarm articles.
          Working dir: /Users/Roberdan/GitHub/ConvergioPlatform

          Add Article XI: Resilience (NON-NEGOTIABLE)
          - Every component must self-recover from ANY failure
          - Circuit breakers at all external boundaries
          - Retry with exponential backoff for transient failures
          - Checkpoint/restart for long-running operations
          - Graceful degradation: partial failure ≠ total failure
          - Health monitoring: every component exposes health status
          - Zero zombies: auto-reap stale processes, worktrees, connections
          - Inspired by HPC distributed systems: fault tolerance is not optional

          Add Article XII: Swarm Intelligence (NON-NEGOTIABLE)
          - Emergent behavior from local agent interactions (Parisi, Nobel 2021)
          - Multi-transport discovery: WiFi, LAN, Tailscale, Thunderbolt
          - Agents are autonomous but coordinated: no single point of failure
          - Observation without interference: monitoring must not affect execution
          - Self-healing topology: if a node fails, the swarm reorganizes
          - Communication efficiency: compact protocols, minimal overhead

          Update version to 3.0.0. Update Version History.
          Keep total file under 250 lines (compress if needed).
        type: doc
        output_type: pr
        model: claude-opus-4-6
        executor_agent: task-executor
        validator_agent: doc-validator
        effort: 2
        verify:
          - "grep -q 'Article XI' CONSTITUTION.md"
          - "grep -q 'Resilience' CONSTITUTION.md"
          - "grep -q 'Article XII' CONSTITUTION.md"
          - "grep -q 'Swarm' CONSTITUTION.md"
          - "grep -q '3.0.0' CONSTITUTION.md"
          - "wc -l < CONSTITUTION.md | awk '{if($1>250) exit 1}'"

      - id: T1-04
        title: |
          Create backup tag v17.1.0-pre-split on current main.
          Working dir: /Users/Roberdan/GitHub/ConvergioPlatform

          1. Verify main is clean: git status --short (must be empty).
          2. Verify tests pass: cd daemon && cargo test.
          3. Create annotated tag: git tag -a v17.1.0-pre-split -m "Pre-split backup: last monorepo state before ecosystem split"
          4. Push tag: git push origin v17.1.0-pre-split
        type: config
        output_type: pr
        model: gpt-5.3-codex
        executor_agent: task-executor
        validator_agent: thor-quality-assurance-guardian
        effort: 1
        verify:
          - "git tag -l 'v17.1.0-pre-split' | grep -q 'pre-split'"

  # ─────────────────────────────────────────────────────────────────────────────
  # WAVE 2: Resilience Framework (daemon core)
  # Build the resilience primitives that ALL future phases depend on.
  # This wave leverages W1's SQLite WAL + retry fixes.
  # ─────────────────────────────────────────────────────────────────────────────
  - id: W2
    name: "Resilience Framework"
    theme: "Circuit breakers, retry, health monitoring, zombie reaper — HPC patterns in daemon"
    precondition: "W1 complete"
    merge_mode: sync
    tasks:
      - id: T2-01
        title: |
          Create resilience module in daemon with circuit breaker + retry.
          Working dir: /Users/Roberdan/GitHub/ConvergioPlatform

          New module: daemon/src/resilience/ with:
          - mod.rs (public API, max 250 lines)
          - circuit_breaker.rs: CircuitBreaker struct with states (Closed/Open/HalfOpen),
            configurable failure threshold, reset timeout. Used for external calls
            (HTTP, SSH, filesystem). Thread-safe (Arc<Mutex>).
          - retry.rs: retry_with_backoff<F, T, E>(f, config) → Result<T, E>.
            Config: max_retries, initial_delay, max_delay, backoff_factor.
            Jitter to prevent thundering herd. Async-compatible (tokio).
          - health.rs: HealthCheck trait, HealthStatus enum (Healthy/Degraded/Unhealthy),
            ComponentHealth struct. Registry for all daemon components.

          Wire into daemon: add `pub mod resilience;` in main lib/mod.
          Integration test: circuit breaker opens after N failures, retry succeeds after transient failure.
          Use in existing code: wrap SQLite connection open with retry (leverage W1's busy_timeout).
        type: feature
        output_type: pr
        model: gpt-5.3-codex
        executor_agent: task-executor
        validator_agent: thor-quality-assurance-guardian
        effort: 3
        verify:
          - "test -f daemon/src/resilience/mod.rs"
          - "test -f daemon/src/resilience/circuit_breaker.rs"
          - "test -f daemon/src/resilience/retry.rs"
          - "test -f daemon/src/resilience/health.rs"
          - "cd daemon && cargo check"
          - "cd daemon && cargo test resilience"

      - id: T2-02
        title: |
          Optimize agent IPC: MessagePack + health endpoints.
          Working dir: /Users/Roberdan/GitHub/ConvergioPlatform

          1. IPC OPTIMIZATION:
          rmp-serde is already in Cargo.toml dependencies.
          Create daemon/src/ipc/compact.rs:
          - serialize_compact<T: Serialize>(value: &T) → Vec<u8> (MessagePack)
          - deserialize_compact<T: DeserializeOwned>(data: &[u8]) → Result<T>
          - Add Content-Type negotiation in IPC handlers:
            Accept: application/msgpack → return MessagePack
            Accept: application/json (default) → return JSON
          This is backwards-compatible: JSON remains default.

          2. DEEP HEALTH ENDPOINT:
          Add GET /api/health/deep → returns ComponentHealth for:
          - database (connection + WAL status + busy check)
          - filesystem (data dir writable + disk space)
          - ipc_engine (initialized or not)
          - swarm (peer count + last heartbeat)
          Wire via resilience::health::HealthRegistry.

          3. Fix IPC engine initialization (audit finding #11):
          ServerState::new() must initialize IpcEngine when available.
          Wire into HTTP router. Lifecycle handlers broadcast events when present.

          Test: health endpoint returns valid JSON with all components.
          Test: MessagePack round-trip serialization.
        type: feature
        output_type: pr
        model: gpt-5.3-codex
        executor_agent: task-executor
        validator_agent: thor-quality-assurance-guardian
        effort: 3
        verify:
          - "test -f daemon/src/ipc/compact.rs"
          - "cd daemon && cargo check"
          - "cd daemon && cargo test ipc"
          - "cd daemon && cargo test health"

      - id: T2-03
        title: |
          Zero-zombie enforcement: reaper + auto-cleanup.
          Working dir: /Users/Roberdan/GitHub/ConvergioPlatform

          New file: daemon/src/resilience/reaper.rs (max 250 lines):
          - WorktreeReaper: scans git worktree list, removes stale worktrees
            (no matching wave/plan in DB, or plan cancelled/done > 24h ago).
          - BranchReaper: removes merged branches (git branch --merged main).
          - ProcessReaper: checks /tmp for stale agent lock files, removes expired.
          - StaleConnectionReaper: closes DB connections idle > 30 min.

          New file: daemon/src/resilience/checkpoint.rs (max 250 lines):
          - save_checkpoint(plan_id, wave_id, state: serde_json::Value) → Result
          - restore_checkpoint(plan_id) → Option<CheckpointState>
          - Uses DB table: checkpoints (plan_id, wave_id, state, created_at)
          - Migration in state_init.rs

          CLI: cvg reap [--dry-run] — runs all reapers, shows what would be cleaned.
          CLI: cvg checkpoint save/restore <plan_id>

          Wire reaper to run automatically every 30 min via tokio::spawn background task.
          Test: create stale worktree, verify reaper cleans it.
        type: feature
        output_type: pr
        model: gpt-5.3-codex
        executor_agent: task-executor
        validator_agent: thor-quality-assurance-guardian
        effort: 3
        verify:
          - "test -f daemon/src/resilience/reaper.rs"
          - "test -f daemon/src/resilience/checkpoint.rs"
          - "cd daemon && cargo check"
          - "cd daemon && cargo test reaper"
          - "cd daemon && cargo test checkpoint"

      - id: T2-04
        title: |
          Local LLM kernel (watchdog) + phone notifications + decision audit.
          Working dir: /Users/Roberdan/GitHub/ConvergioPlatform

          F-26 LOCAL LLM KERNEL:
          New file: daemon/src/resilience/watchdog.rs (max 250 lines):
          - WatchdogConfig: model_path, check_interval_secs, notification_channels
          - Watchdog struct: spawns tokio background task that every 30s:
            a) Checks daemon /api/health/deep (circuit breaker protected)
            b) Checks agent progress (last DB update > threshold = stalled)
            c) Checks git worktree list for orphans
            d) Checks /tmp for stale lock files
            e) On failure: attempts restart, then sends notification
          - Uses Ollama HTTP API (localhost:11434) as local inference for:
            a) Summarizing error state for notifications
            b) Deciding restart vs escalate
          - Fallback: if Ollama unavailable, use hardcoded rules (no LLM needed)
          - CLI: cvg watchdog start/stop/status

          F-28 PHONE NOTIFICATIONS:
          New file: daemon/src/resilience/notify.rs (max 250 lines):
          - NotifyChannel trait: send(title, message, severity) → Result
          - NtfyChannel: HTTP POST to ntfy.sh topic (from notifications.conf)
          - TelegramChannel: HTTP POST to Telegram bot API (from notifications.conf)
          - MacOSChannel: terminal-notifier / osascript (already in api_notify)
          - Enable ntfy in config: claude-config/config/notifications.conf
          - CLI: cvg notify send "title" "message" [--severity critical|warning|info]
          - Watchdog calls notify on: agent blocked >5min, crash, rate limit, wave complete

          F-27 DECISION AUDIT TRAIL:
          Migration: CREATE TABLE decision_log (
            id INTEGER PRIMARY KEY,
            plan_id INTEGER, task_id INTEGER,
            decision TEXT NOT NULL,
            reasoning TEXT NOT NULL,
            first_principles TEXT,
            alternatives_considered TEXT,
            outcome TEXT,
            created_at DATETIME DEFAULT CURRENT_TIMESTAMP,
            agent TEXT
          );
          API: POST /api/decisions (log a decision), GET /api/decisions?plan_id=X
          CLI: cvg decision log "decision" --reasoning "why" [--plan-id X]
          File: daemon/src/server/api_decisions.rs (new, max 250 lines)

          F-29 SELF-VERIFICATION:
          Add to task submission flow in server/api_plan_db_lifecycle/handlers.rs:
          Before accepting status=submitted, run ALL verify[] commands from test_criteria.
          If ANY verify fails, reject the submission with error details.
          This prevents agents from self-reporting success without evidence.
          Log verification results in decision_log.

          Test: watchdog detects simulated stalled agent.
          Test: notification sends to ntfy.sh mock.
          Test: decision log stores and retrieves entries.
          Test: task submission rejected when verify fails.
        type: feature
        output_type: pr
        model: claude-opus-4-6
        executor_agent: task-executor
        validator_agent: thor-quality-assurance-guardian
        effort: 3
        verify:
          - "test -f daemon/src/resilience/watchdog.rs"
          - "test -f daemon/src/resilience/notify.rs"
          - "test -f daemon/src/server/api_decisions.rs"
          - "cd daemon && cargo check"
          - "cd daemon && cargo test watchdog"
          - "cd daemon && cargo test decision"
          - "wc -l < daemon/src/resilience/watchdog.rs | awk '{if($1>250) exit 1}'"
          - "wc -l < daemon/src/resilience/notify.rs | awk '{if($1>250) exit 1}'"

