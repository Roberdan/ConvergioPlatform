user_request: >
  Plan C — Convergio Ecosystem. Plugin integration (daemon-driven skill enable with
  requires-plugins activation), domain-aware tool activation (/solve detects domain,
  suggests skills), MyConvergio setup/rollback (new setup.sh, kill copilot-sync.sh,
  community governance CI), CRDT automatic background sync (daemon always-on,
  transparent peer replication). Optimized for Copilot agent execution.

constraints:
  - id: C-01
    text: "Every task max 1-2 files touched — Copilot execution constraint"
    type: process
    verify: "git diff --name-only | wc -l | awk '{if($1>3) exit 1}'"
  - id: C-02
    text: "No todo!(), TODO, FIXME, or empty handlers — zero stubs"
    type: technical
    verify: "! grep -rn 'todo!\\|TODO\\|FIXME' daemon/src/"
  - id: C-03
    text: "Tests written by Opus/Sonnet only — Constitution Art. V"
    type: process
  - id: C-04
    text: "Daemon is single source of truth — no direct sqlite3 access"
    type: technical
    verify: "! grep -rn 'sqlite3 ' scripts/"
  - id: C-05
    text: "Max 250 lines per file — split if exceeds"
    type: technical
    verify: "find daemon/src -name '*.rs' -exec sh -c 'wc -l < \"$1\" | awk \"{if(\\$1>250) exit 1}\"' _ {} \\;"
  - id: C-06
    text: "Multi-provider native — no Claude-specific assumptions in setup"
    type: technical
  - id: C-07
    text: "MCP NOT deployed — domain activation via cvg skill enable, not MCP servers"
    type: technical
    verify: "! grep -q 'mcpServers' .claude/settings.json"

requirements:
  - id: F-01
    text: "cvg skill enable <name> activates plugins declared in requires-plugins via settings.json write"
    wave: W1
  - id: F-02
    text: "cvg skill enable <name> auto-enables agents declared in requires-agents (partial — enhance)"
    wave: W1
  - id: F-03
    text: "cvg skill disable <name> removes plugins/agents not used by other active skills"
    wave: W1
  - id: F-04
    text: "Skill lint validates requires-plugins and requires-agents (format, naming, existence)"
    wave: W1
  - id: F-05
    text: "skill-protocol.md updated with requires-* field reference"
    wave: W1
  - id: F-06
    text: "At least 1 existing skill declares requires-plugins as reference implementation"
    wave: W1
  - id: F-07
    text: "/solve phase 1 detects problem domain (healthcare, deploy, design, etc.)"
    wave: W2
  - id: F-08
    text: "/solve suggests skills/tools to activate via cvg skill enable per domain"
    wave: W2
  - id: F-09
    text: "Domain detection configurable: cvg domain list, cvg domain map <domain> <skill>"
    wave: W2
  - id: F-10
    text: "/solve shows user what will be activated and asks confirmation (HITL)"
    wave: W2
  - id: F-11
    text: "New setup.sh configures Claude Code + Copilot CLI + generic LLM from MyConvergio"
    wave: W4
  - id: F-12
    text: "setup.sh --rollback removes installed configuration via manifest"
    wave: W4
  - id: F-13
    text: "Setup uses cvg agent sync --provider <X> for provider-specific generation"
    wave: W4
  - id: F-14
    text: "Eliminate copilot-sync.sh — replaced by setup.sh + cvg agent sync"
    wave: W4
  - id: F-15
    text: "Community governance: CLA in CONTRIBUTING.md, cvg skill lint in CI (GitHub Action)"
    wave: W4
  - id: F-16
    text: "setup.sh works standalone without daemon (fallback HTTP -> file-based)"
    wave: W4
  - id: F-17
    text: "Daemon background task: sync CRDT with known peers at configurable interval (default 30s)"
    wave: W3
  - id: F-18
    text: "Transparent sync: no manual commands, daemon running = syncing"
    wave: W3
  - id: F-19
    text: "HTTP endpoints: /api/crdt/status, /api/crdt/force-sync, /api/crdt/peers"
    wave: W3
  - id: F-20
    text: "Health check: peer unreachable after N cycles -> marked unreachable in mesh_sync_stats"
    wave: W3
  - id: F-21
    text: "Graceful degradation: WAL-only if crsqlite unavailable + health endpoint reports mode"
    wave: W3
  - id: F-22
    text: "Eliminate mesh-sync.sh for DB sync — keep only for git config sync"
    wave: W4

