    verify: "cargo test -p convergio-platform-daemon -- cli_skill_enable"
    defined_by: solve
  - description: "Skill lint validates requires-* fields"
    verify: "cargo test -p convergio-platform-daemon -- cli_skill::test_lint"
    defined_by: solve
  - description: "Skill protocol docs include requires-plugins"
    verify: "grep -q 'requires-plugins' claude-config/reference/operational/skill-protocol.md"
    defined_by: solve
  - description: "At least one skill declares requires-plugins"
    verify: "grep -rq 'requires-plugins:' claude-config/skills/*/skill.yaml"
    defined_by: solve
  - description: "Domain skill map table exists"
    verify: "cargo test -p convergio-platform-daemon -- domain_skill_map"
    defined_by: solve
  - description: "CRDT HTTP endpoints registered"
