          - "find daemon/src/tui/ -name '*.rs' -exec sh -c 'lines=$(wc -l < \"$1\"); if [ \"$lines\" -gt 250 ]; then echo \"FAIL: $1 has $lines lines\"; exit 1; fi' _ {} \\;"
        test_criteria: "Full suite green, clippy clean, all files under 250 lines, 7 of 9 views render real content"

  - id: W4
    name: "Workspace + Deliverables + Final Integration"
    description: "Implement Workspace and Deliverables views. Full integration test across all 9 views."
    tasks:
      - id: T4-01
        title: >
          Create daemon/src/tui/views/workspace.rs — Workspace view:
          (1) workspace_view(data: &TuiData, selected: usize) → renders workspace list.
