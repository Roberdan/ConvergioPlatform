# ─────────────────────────────────────────────────────────────────────────────
# STRATEGIC CONTEXT (from research sessions)
# ─────────────────────────────────────────────────────────────────────────────

strategic_context:
  thesis: >
    Convergio wins 6 to 3 vs OpenClaw/NemoClaw. The 3 gaps (channels, sandboxing,
    declarative deploy) are closeable. With Plans O, P, and extensions to I/K/F2/L,
    Convergio becomes a platform that creates, orchestrates, validates, and distributes
    agent intelligence in any format — something no competitor can do.

  human_in_the_loop_vision: >
    Agent works → finds block → emits need_human → daemon routes to notification_queue
    → fan-out to active channels (ntfy push, macOS banner, Telegram, Slack)
    → first channel to respond wins → daemon → IPC → agent resumes
    → evolution tracks escalation patterns → auto-approves predictable decisions
    → system progressively reduces human involvement

  accelerator_factory_vision: >
    Future Plan Q (2027): given a scenario.yaml (domain + use_case + compliance),
    generate complete accelerator instance (agents, orchestration, eval, data, deploy).
    Requires P (artifact registry) as foundation. Not planned now — just the
    manifest schema ADR in Plan P/F-08 establishes the vocabulary.

  what_not_to_copy_from_hve_core:
    - "VS Code extension packaging (it's a channel, not engine)"
    - "PowerShell tooling (different ecosystem)"
    - ".copilot-tracking/ filesystem state (Plan DB is superior)"
    - "Manual /clear between phases (Convergio orchestrates automatically)"

  what_not_to_copy_from_nemoclaw:
    - "Single agent per sandbox (IPC bus is fundamentally superior)"
    - "Static skills from docs (dynamic registry with confidence is better)"
    - "Container per agent (too heavy for mesh model)"
    - "Polling-based channel bridges (WebSocket where possible)"

