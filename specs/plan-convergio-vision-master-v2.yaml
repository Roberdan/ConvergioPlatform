    note: >
      NEW PLAN. Unified registry for all platform artifacts (agents, skills,
      rules, standards, templates) with metadata (constraints, maturity, domain).
      Channel renderers transform registry → output format.
      This is what makes Convergio produce HVE-Core-equivalent outputs AND more.
    status: new
    phase: 2
    requirements:
      - id: F-01
        title: "Artifacts DB table + API"
        description: >
          Table: artifacts (id, type, name, domain, maturity, constraints_json,
          metadata_json, source_path, created_at, updated_at).
          API: GET /api/artifacts, GET /api/artifacts/:id, POST /api/artifacts/scan.
          CLI: cvg artifact list|show|scan.
          Populated by scanning claude-config/agents/, rules/, skills/.
      - id: F-02
        title: "Renderer trait"
        description: >
          Generic trait: render(registry, format, options) → Vec<OutputFile>.
          OutputFile: path, content, content_type. Async.
      - id: F-03
        title: "Report renderer"
        description: >
          render-to-report: generates markdown/PDF with agent catalog,
          metrics, compliance status, architecture overview.
          First renderer — simplest, immediately useful.
      - id: F-04
        title: "VS Code extension renderer"
        description: >
          render-to-vscode-extension: generates .vsix with agents/*.agent.md +
          instructions/*.instructions.md. Equivalent to HVE-Core, but
          generated from Convergio's registry.
      - id: F-05
        title: "OpenClaw renderer"
        description: >
          render-to-openclaw: generates SKILL.md + index.json.
          Supersedes current convergio-openclaw-skills.sh static script.
      - id: F-06
        title: "API renderer"
        description: >
          GET /api/artifacts?domain=security&maturity=stable returns
          filtered, formatted artifact data. Already almost possible
          with F-01 API — this adds format negotiation (JSON, YAML, MD).
      - id: F-07
        title: "Instructions extraction"
        description: >
          Extract coding standards from CLAUDE.md + rules/ into
          .github/instructions/*.instructions.md with applyTo globs.
          Format compatible with both Copilot native and Claude.
          Existing content, new format — refactoring not creation.
      - id: F-08
        title: "Accelerator manifest schema (ADR)"
        description: >
          Define accelerator.yaml format: domain, agents, workflows,
          eval_scenarios, data_schemas, deploy_target. ADR only —
          no implementation. Establishes vocabulary for future Plan Q.
        note: "Spike task. The actual Accelerator Factory is 2027."
      - id: F-09
        title: "Blueprint declarative format"
        description: >
          convergio-blueprint.yaml: declares full deployment (agents,
          channels, inference, policies, ports). Inspired by NemoClaw's
          blueprint.yaml but richer. cvg deploy plan/apply/rollback stubs.
        source: "convergio-autonomous-channels-complete.md §5"
    repo_mapping:
      - component: "Artifacts table + API"
        repo: convergio-daemon
        path: "src/server/api_artifacts.rs"
      - component: "Renderer trait + implementations"
        repo: convergio-daemon
        path: "src/artifacts/"
      - component: "Instructions extraction"
