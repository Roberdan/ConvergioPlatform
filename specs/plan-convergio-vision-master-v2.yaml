    tasks: 9
    depends_on: [H]
    status: draft
    phase: 1
    # v2 additions from HVE-Core analysis:
    additions:
      - id: F-10
        title: "Declarative agent constraints"
        description: >
          Add constraints field to agent frontmatter: can, cannot, must, isolation.
          Daemon enforces constraints at runtime via hooks (PreToolUse blocks
          forbidden actions). Thor validates constraint compliance.
        source: "convergio-hve-core-strategic-report.md §4.1"
        effort: 2
      - id: F-11
        title: "Agent maturity lifecycle"
        description: >
          Add maturity field to agent frontmatter: draft, experimental, preview,
          stable, deprecated. Daemon loads only stable in production, experimental
          in worktrees. Evolution engine auto-promotes based on metrics
          (task success rate, Thor pass rate, cost/token ratio).
        source: "convergio-hve-core-strategic-report.md §4.2"
        effort: 2

  - id: K
    name: "Plan K — Agentic Memory"
    db_id: 715
    spec: specs/plan-k-agentic-memory.yaml
    waves: 3
    tasks: 8  # +1 from v2
    depends_on: [I]
    note: "Parallel with J"
    status: draft
    phase: 1
    # v2 addition from HVE-Core analysis:
    additions:
      - id: F-09
        title: "Context matching automatico"
        description: >
          Task tags auto-resolve to context files. task.tags=["mesh","security"]
          → inject mesh-networking.md + auth-patterns.md + rust.instructions.md.
          Daemon resolves context via tag→document mapping in KB.
          Generalization of HVE-Core's applyTo at task level, not file level.
        source: "convergio-hve-core-strategic-report.md §4.3"
