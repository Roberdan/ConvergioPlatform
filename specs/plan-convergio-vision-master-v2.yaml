# Convergio Vision — Master Plan v2.0
# Updated 25 Marzo 2026 incorporating:
#   - HVE-Core strategic analysis (declarative constraints, maturity lifecycle, context matching)
#   - Accelerator Factory research (artifact registry, channel layer, industry profiles)
#   - Autonomous channels research (human-in-the-loop, notification loop, channel adapters)
#   - OpenClaw/NemoClaw gap analysis (egress policy, onboarding, blueprints)
#
# Phase 0 (Plan 724) is the prerequisite. Plans H0/H0b are pre-H foundation.
# Plans O and P are NEW — derived from cross-session strategic research.
# Plan I and K get additional requirements from HVE-Core analysis.
# Plan F2 gets extended scope for actionable notifications + Live Activities.
# Plan L gets channel egress rules.

name: "Convergio Vision — Business OS"
version: "2.0.0"
project_id: convergio
execution_mode: mixed
prerequisite: "Plan 724 (Phase 0 — Foundation & Resilient Ecosystem)"

description: >
  Master plan orchestrating Convergio from control plane to end-to-end Business OS.
  Twelve plans (H0, H0b, H-N, O, P) covering: TUI hierarchy, mesh delegation,
  NASA hardening, checklist engine, MCP client, agentic memory, SwiftUI rebuild,
  security perimeters, inference routing, voice, channel adapters, and artifact registry.

  Strategic thesis: Convergio is a platform that orchestrates agents AND distributes
  their output in any format — reports, websites, VS Code extensions, API responses,
  Telegram messages. The channel layer + artifact registry transform it from
  "dev tool" to "Business OS that produces finished outputs for any domain."

# ─────────────────────────────────────────────────────────────────────────────
# EXECUTION PHASES (sequential gates, parallel within phases)
# ─────────────────────────────────────────────────────────────────────────────

phases:
  - id: phase-1
    name: "Core Capabilities"
    description: "Harden the engine, add checklists, memory, MCP, SwiftUI"
    plans: [H0, H0b, H, I, K, F2]
    gate: "All plans merged, all tests green, all worktrees clean"

  - id: phase-2
    name: "Open Platform"
    description: "External channels, artifact registry, security perimeters"
    plans: [J, O, P, L]
    gate: "Channel adapters functional, artifact registry populated, egress enforced"

  - id: phase-3
    name: "Intelligence Layer"
    description: "Smart inference, voice, evolution feedback from channels"
    plans: [M, N]
    gate: "Local inference routing, voice prototype, evolution learning from channel data"

