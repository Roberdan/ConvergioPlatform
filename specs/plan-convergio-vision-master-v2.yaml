        description: >
          Egress firewall extended for channel adapters. Telegram adapter
          can only reach api.telegram.org. Slack adapter can only reach
          slack.com + wss-primary.slack.com. Declarative YAML format
          inspired by NemoClaw openclaw-sandbox.yaml.
        source: "convergio-autonomous-channels-complete.md §5, convergio-vs-openclaw-strategic.md"
        effort: 2
      - id: F-10
        title: "Operator approval loop for unauthorized actions"
        description: >
          Agent attempts unauthorized action → daemon blocks → notification
          (macOS/ntfy/Telegram) → user approves/denies → result back to agent.
          Builds on Plan O channel infra + Plan F2 actionable notifications.
          Inspired by NemoClaw's TUI approval loop, but multi-channel.
        source: "convergio-autonomous-channels-complete.md §5"
        effort: 3

