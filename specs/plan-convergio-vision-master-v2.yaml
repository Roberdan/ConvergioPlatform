    depends_on: [I, H0]
    status: draft
    phase: 1
    # v2 additions from channels research:
    additions:
      - id: F-11
        title: "Actionable notifications with inline reply"
        description: >
          UNTextInputNotificationAction + UNNotificationAction in NotificationManager.
          Categories: AGENT_ESCALATION (approve+reply), PLAN_APPROVAL (approve+reject),
          EVOLUTION_PROPOSAL (approve+reject+details).
          Handler didReceive → WS → daemon → IPC bus → agent resumes.
          Closes the human-in-the-loop for macOS.
        source: "convergio-autonomous-channels-complete.md §3 Layer 1"
        effort: 3
      - id: F-12
