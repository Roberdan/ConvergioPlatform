    status: draft
    phase: 2

  - id: O
    name: "Plan O — Channel Adapters"
    db_id: null  # to be created
    spec: specs/plan-o-channel-adapters.yaml
    waves: 3
    tasks: 10
    depends_on: [Phase-0-W2]  # needs notify infra from F-28
    note: >
      NEW PLAN. Bidirectional external channels. Runtime adapters in
      daemon/src/channels/. Config presets in convergio-community.
      First channel: Telegram (simple API, ~80 lines Rust).
      Does NOT wait for Plan L — Telegram egress is safe.
      L adds egress policy on top later.
    status: new
    phase: 2
    requirements:
      - id: F-01
        title: "ChannelAdapter trait"
        description: >
          Generic trait: connect(), send(), receive(), disconnect(), health().
          Async, tokio-compatible. Error types for rate limit, auth, network.
          Trait in daemon/src/channels/mod.rs.
      - id: F-02
        title: "Telegram adapter"
        description: >
          Long-polling getUpdates + sendMessage via reqwest.
          Inbound: message → IPC bus → skill executor → response → sendMessage.
          Commands: /status, /approve <id>, /reject <id>, /ask <query>.
          ~80 lines of Rust. Bot token from env var.
      - id: F-03
        title: "Slack adapter"
        description: >
          Socket Mode (WebSocket) for real-time events. Slash commands:
          /convergio-status, /convergio-approve. App manifest for OAuth.
          Higher enterprise value than Telegram.
      - id: F-04
        title: "Email adapter"
        description: >
          IMAP polling for inbound, SMTP for outbound. Structured subject
          for routing: [CONVERGIO-APPROVE-{id}], [CONVERGIO-STATUS].
          Useful for async, non-real-time human-in-the-loop.
      - id: F-05
        title: "Channel routing"
        description: >
          notifications.conf extended: per-event-type channel routing.
          need_human → [ntfy, telegram, macos]. plan_complete → [email, slack].
          First channel to respond wins (fan-out, first-reply).
      - id: F-06
        title: "Channel API + CLI"
        description: >
          GET /api/channels — list active channels + health.
          POST /api/channels/:id/send — manual send.
          cvg channel list|status|test|send.
      - id: F-07
        title: "Channel dashboard view"
        description: >
          Dashboard panel: active channels, message volume, response times.
          Per-channel health indicator. In dashboard/channels/.
      - id: F-08
        title: "Evolution feedback from channels"
        description: >
          Channel interactions feed evolution engine. Metrics: escalation count
          per agent, human response time, approval rate per agent.
          Enables proposals like "Agent X escalates too much on task type Y →
          increase autonomy" or "Decision Z always approved → auto-approve".
      - id: F-09
        title: "ntfy.sh integration"
        description: >
          Fix route mismatch: orchestrator calls /api/notify/send but handler
          is on /api/notify. Enable ntfy.sh as push backend. Single POST.
          Phone notifications working in <1 hour.
        note: "This is the P0 quick win from the channels research."
      - id: F-10
        title: "TUI notification inbox"
        description: >
          Consumer for notification_queue / pending_notifications in TUI.
          Shows unread count in status bar. Drill into notification → action.
    repo_mapping:
