             Include in the delegated agent's prompt:
             - "For EACH task: cvg task update <id> in_progress → work → cvg task update <id> submitted"
             - "After each wave: cvg plan validate <plan_id>"
             - "Run ALL verify[] commands before submitting"
             - "After all waves: cvg plan complete <plan_id>"

          2. Add cvg delegation CLI commands:
             cvg delegation start <plan_id> --peer <peer>
             cvg delegation cancel <plan_id>
             Wire into CLI dispatch.

          3. Unify the 3 delegation paths (sse_delegate, executor, bash script)
             into ONE core function called by all three.

          4. Per-task IPC callback: done_script POSTs progress after EACH task.

          5. Git credential propagation: deploy-node.sh copies gh auth token.

          6. DELEGATION PRE-FLIGHT (NON-NEGOTIABLE):
             Before delegating ANY work to a peer node:
             a. Call GET /api/node/readiness on the target — must return ok:true
             b. Verify cvg plan list returns data (daemon + DB working)
             c. Verify claude/copilot CLI is available on target
             d. Sync claude memory: rsync ~/.claude/projects/ to target
             e. Sync ~/.convergio/env to target (credentials)
             If ANY pre-flight fails: refuse delegation with clear error, don't silently proceed.

