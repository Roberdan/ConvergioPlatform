      - id: T2-02
        ref: [F-17]
        do: |
          Harden kernel evidence gate to prevent resource exhaustion.

          The kernel evidence gate in api_plan_db.rs spawns `cargo test` on every
          task status transition to "submitted"/"done". This causes:
          - 482 threads, 50% CPU, 500MB+ RAM per invocation
          - No timeout — hangs forever if tests are slow
          - No mutex — multiple concurrent transitions spawn parallel cargo tests
          - No child process cleanup on timeout/failure

          ALREADY DONE (this session):
          - cargo test --lib only (not full suite)
          - 90s timeout with SIGKILL on process group
          - setpgid(0,0) for clean child tree cleanup
          Committed: c94096e

          REMAINING (this task):
          1. Add static Mutex so only 1 evidence check runs at a time
          2. SHA-based cache: if git HEAD unchanged since last pass, skip (5min TTL)
          3. On daemon shutdown: reap orphaned cargo/rustc processes

          Working dir: /Users/Roberdan/GitHub/ConvergioPlatform
        type: fix
        output_type: pr
        model: claude-opus-4-6
        executor_agent: copilot
        validator_agent: thor-quality-assurance-guardian
        effort: 2
        verify:
          - "cargo check --features kernel --manifest-path daemon/Cargo.toml"
          - "grep -q 'timeout\\|Timeout' daemon/src/kernel/verify.rs"
          - "grep -q 'Mutex\\|mutex' daemon/src/kernel/verify_checks.rs"

      - id: T2-03
        ref: [F-21]
        do: |
          Workflow enforcement hooks — agents CANNOT bypass the process.

          Create Claude Code hooks in settings.json that BLOCK violations:

          1. PreToolUse hook for Edit/Write:
             If a plan is active (cvg plan list --status doing) AND the current
             session did NOT invoke /execute → BLOCK with message:
             "Active plan detected. Use /execute {plan_id} to modify code."
             Exception: files in specs/, docs/, claude-config/ (non-code).

          2. SubagentStop hook:
             When any agent completes: auto-commit uncommitted work,
             verify task status updated in DB, warn if no cvg task update was called.

          3. PreToolUse hook for cvg task update to "done":
             BLOCK — only Thor (cvg plan validate) can promote to done.
             Message: "Cannot set done directly. Use cvg task update <id> submitted."

          4. PostToolUse hook for git push/merge:
             Verify review exists for the plan. BLOCK if no review registered.

          5. Install hooks via scripts/platform/install-hooks.sh:
             Reads hook definitions from claude-config/hooks/workflow-enforcement.json
             Merges into ~/.claude/settings.json preserving existing hooks.
             deploy-node.sh calls this automatically.

          Working dir: /Users/Roberdan/GitHub/ConvergioPlatform
        type: feature
        output_type: pr
        model: claude-opus-4-6
        executor_agent: copilot
        validator_agent: thor-quality-assurance-guardian
        effort: 2
        verify:
          - "test -f claude-config/hooks/workflow-enforcement.json"
          - "test -f scripts/platform/install-hooks.sh"
          - "bash -n scripts/platform/install-hooks.sh"

