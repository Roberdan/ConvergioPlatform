# Plan X v2 — Convergio Hardening (Complete)
# Replaces cancelled Plan 740. Based on improvement report + session feedback.
# Core change: libSQL replaces rusqlite+crsqlite for native sync.
# 28 March 2026.

name: "Plan X v2 — Convergio Hardening"
project_id: convergio
priority: P0
execution_mode: serial
tags: [hardening, libsql, sync, mesh, delegation, dx, terminal-stack]

description: >
  Complete platform hardening. Migrate from rusqlite+crsqlite to libSQL
  for native DB sync. Fix 9 confirmed bugs. Unify delegation workflow.
  Replicate terminal stack. Clean worktrees. Close documentation gaps.
  Ensure agents use Convergio tools (cvg plan validate, cvg task update).

requirements:
  - F-01: "libSQL replaces rusqlite — DB sync native between all nodes"
  - F-02: "cvg review register works on spec-file before plan creation"
  - F-03: "coordinator/emit works without CRDT extension (guard or libSQL)"
  - F-04: "delegated agents execute cvg task update + cvg plan validate per wave"
  - F-05: "daemon binds 0.0.0.0 in dev-mode (reachable from mesh peers)"
  - F-06: "centralized peer resolver with fallback chain"
  - F-07: "all missing API routes wired (/channels, /health/deep)"
  - F-08: "cvg delegation start/status/cancel CLI complete and functional"
  - F-09: "delegation prompt includes full Thor workflow + verify commands"
  - F-10: "terminal stack replicated on all nodes via deploy-node.sh"
  - F-11: "automatic worktree cleanup on plan completion"
  - F-12: "spec YAML schema documented + cvg plan template"
  - F-13: "all documentation gaps closed (D1-D7 from report)"
  - F-14: "invoke_agent MCP tool functional"
  - F-15: "full E2E test passes on both nodes"

waves:
  - id: W1
    name: "libSQL Migration — replace rusqlite"
    merge_mode: sync
    tasks:
      - id: T1-01
        ref: [F-01]
        do: |
          Migrate daemon from rusqlite to libSQL for native embedded replica sync.

          1. Update daemon/Cargo.toml:
             Remove: rusqlite = "0.32"
             Add: libsql = { version = "0.6", features = ["replication"] }

          2. Create daemon/src/db/libsql_adapter.rs:
             Thin adapter that maps libsql API to our existing DB patterns.
             libsql::Database::open() instead of Connection::open().
             libsql uses similar SQL syntax — most queries stay the same.

          3. Update daemon/src/db/mod.rs:
             Replace rusqlite Connection with libsql Connection.
             Remove resolve_crsqlite_path() — no longer needed.
             Remove all crsqlite/CRDT code.

          4. Update ALL files that use rusqlite::Connection (grep -rn 'rusqlite' daemon/src/):
             Change use statements, type signatures, error handling.
             libsql has similar API but different error types.

          5. Configure sync between nodes:
             Each daemon starts with libsql embedded replica.
             Primary node (coordinator) is the write source.
             Other nodes sync from primary via HTTP.

          6. Verify: cargo check, cargo test --lib

          NOTE: This is the biggest task. Take care with the migration.
          If libsql API is too different, consider keeping rusqlite and
          implementing timestamp-based sync in Rust (200 lines, simpler).
          Working dir: /Users/Roberdan/GitHub/ConvergioPlatform
        type: refactor
        output_type: pr
        model: claude-opus-4-6
        executor_agent: task-executor
        validator_agent: thor-quality-assurance-guardian
        effort: 3
        verify:
          - "cargo check --features kernel --manifest-path daemon/Cargo.toml"
          - "! grep -q 'crsqlite' daemon/src/db/mod.rs"

      - id: T1-02
        ref: [F-03]
        do: |
          Fix coordinator/emit CRDT error.
          If libSQL migration done (T1-01): this is automatic — no CRDT extension needed.
          If libSQL NOT done: guard all crsqlite calls with runtime check.

          Primary target: daemon/src/db/crdt/sync.rs (lines querying crsql_changes).
          Guard: fn crdt_available(conn) -> bool, skip CRDT if false.
          Coordinator must work WITHOUT CRDT.
          Working dir: /Users/Roberdan/GitHub/ConvergioPlatform
        type: fix
        output_type: pr
        model: claude-opus-4-6
        executor_agent: task-executor
        validator_agent: thor-quality-assurance-guardian
        effort: 2
        verify:
