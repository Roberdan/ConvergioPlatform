        do: |
          Fix bugs B1, B2, B3, B4, B6, B7, B8, B9 from improvement report.

          B1: cvg review register --spec-file crashes (NOT NULL plan_id).
              Allow plan_id=0 or NULL for spec-file reviews.

          B2: /api/channels not mounted. Wire api_channels.rs in routes/mod.rs.
          B3: /api/health/deep not mounted. Wire api_health_deep.rs.
          B4: delegation status 404 — align plan_id vs delegation_id.

          B6: /api/mesh/exec SSH doesn't resolve peers.
              Use peer_ssh_alias() from peers.conf.

          B7: daemon binds 127.0.0.1. Bind 0.0.0.0 in dev-mode only.

          B8: cvg plan tree doesn't show wave names. Add wave_id + wave_name.

          B9: centralized peer resolver.
              Create daemon/src/mesh/peer_resolver.rs.
              Fallback chain: SSH config → Tailscale IP → LAN → DNS.
              All mesh code uses this resolver.

