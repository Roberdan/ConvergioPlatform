          - Daemon reads token from this file on startup.
          - Add shared token file path to CLAUDE.md so app/CLI know where to read.
          - Add GET /api/auth/token-info endpoint (authenticated) to verify token validity.
          - Document in convergio-app README how the app will read this token.
          Remove: any hardcoded token patterns in server code.
          Test: integration test verifying: (a) unauthenticated request rejected,
          (b) valid token accepted, (c) invalid token rejected.
        type: fix
        output_type: pr
        model: gpt-5.3-codex
        executor_agent: task-executor
        validator_agent: thor-quality-assurance-guardian
        effort: 2
        verify:
          - "cd /Users/Roberdan/GitHub/convergio-daemon && cargo check"
          - "cd /Users/Roberdan/GitHub/convergio-daemon && cargo test"
          - "cd /Users/Roberdan/GitHub/convergio-daemon && cargo test auth"

      - id: T4-02
        title: |
          Fix dashboard/static path reconciliation (audit finding #2).
          In convergio-daemon repo.
          Now that convergio-web is a separate repo, update daemon's static
          file serving to use CONVERGIO_WEB_DIR env var.
          In src/server/mod.rs (now <250 lines after W1 split), replace
          hardcoded scripts/dashboard_web path with configurable path.
          Resolution order: CONVERGIO_WEB_DIR env → ../convergio-web relative
          to binary → skip static serving with console.warn (not crash).
          Remove: ALL references to dashboard_web, scripts/dashboard in daemon src.
          Test: daemon starts cleanly with and without web dir present.
        type: fix
        output_type: pr
        model: gpt-5.3-codex
        executor_agent: task-executor
        validator_agent: thor-quality-assurance-guardian
        effort: 2
        verify:
