    name: "Audit Cleanup"
    theme: "Fix remaining audit findings: auth, dashboard path, orchestration, IPC, hardening"
    precondition: "W2 complete"
    merge_mode: batch
    tasks:
      - id: T4-01
        title: |
          Fix daemon auth path for native app consumption (audit finding #5).
