# Plan Phase 0 — Foundation & Repo Split (v2 — post-review)
# Prerequisite for ALL 711 sub-plans. Must complete before 712-721 execution.
# F-01 (repo split), F-02 (naming), F-03 (multi-repo), F-04 (OpenAPI), F-05 (audit cleanup)
# Review fixes applied: 7 blocking + 9 suggestions from plan-reviewer 24 Marzo 2026

name: "Phase 0 — Foundation & Repo Split"
project: convergio
version: "17.0.0"
constitution-version: "2.3.0"
parallel_mode: standard

requirements:
  - "F-01: Repo split — ConvergioPlatform splits into convergio-daemon, convergio-app, convergio-web, convergio (meta)"
  - "F-02: Naming convention — MyConvergio→convergio-community, MaranelloLuceDesign→maranello-design"
  - "F-03: Multi-repo orchestration — repositories table, cvg repo add/list/link, cross-project plan dependencies"
  - "F-04: OpenAPI spec versioned in convergio (meta) repo as API contract boundary"
  - "F-05: All 15 audit findings fixed (mapped below)"
  - "F-10: Dogfooding — this plan validates Convergio's ability to manage itself"
  - "F-11: Zero tech debt — every touched file fully clean, tested, documented"

# Audit finding → task mapping (F-05 complete coverage):
#  #1  (711 not started)         → out of scope (plan management, not code)
#  #2  (dashboard path drift)    → T4-02
#  #3  (macOS app web shell)     → T2-02 (remove webview, start native)
#  #4  (macOS build broken)      → T2-02 (fix .frame() + onChange)
#  #5  (no auth in Swift)        → T4-01
#  #6  (bridge actions unhooked) → T4-05
#  #7  (TUI test broken)         → T1-02
#  #8  (TUI data model flat)     → deferred to plan 719 (TUI hierarchy)
#  #9  (TUI UX generic)          → deferred to plan 719
#  #10 (hardening mixed)         → T4-06 (sh -c, thread::spawn, direct SQLite)
#  #11 (IPC drift)               → T4-03
#  #12 (plan lifecycle txn)      → T4-04
#  #13 (specs ahead of code)     → resolved by repo split + multi-repo capability
#  #14 (validation asymmetric)   → resolved by per-repo CI (T2-05)
#  #15 (over-claims completeness)→ resolved by updated docs (TF-doc)

