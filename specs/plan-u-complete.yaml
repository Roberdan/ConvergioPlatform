          Test and fix Telegram voice on M1 Pro end-to-end.
          telegram_voice.rs already exists. Verify it works:

          Inbound voice:
          1. User sends voice note to bot
          2. Bot downloads OGG → tempfile
          3. Convert OGG → WAV (check if ffmpeg or sox available on M1 Pro)
          4. POST /api/kernel/transcribe → text
          5. Process text → reply with text + voice

          Outbound voice:
          1. Generate TTS (macOS say → WAV)
          2. Convert WAV → OGG for Telegram (ffmpeg or opusenc)
          3. POST sendVoice with OGG file

          If ffmpeg not installed on M1 Pro: install via brew or use sox.
          Test: send actual voice note to @ConvergioBot, verify transcription + reply.
          Working dir: /Users/Roberdan/GitHub/ConvergioPlatform
