  # WAVE 2: Node Lifecycle + Path Portability
  # ─────────────────────────────────────────────────────────────────────────

  - id: W2
    name: "Node Lifecycle — crsqlite, provisioning, paths"
    merge_mode: sync
    tasks:
      - id: T2-01
        ref: [F-05]
        do: |
          Install crsqlite on M1 Pro. Steps:
          1. Download crsqlite.dylib for macOS arm64 from GitHub releases
             (https://github.com/nicktimko/crsqlite or official vlcn.io releases)
          2. SSH to M1 Pro: place in a discoverable path
          3. Update daemon to look for crsqlite in multiple paths:
             ./crsqlite.dylib, /usr/local/lib/crsqlite.dylib, ~/lib/crsqlite.dylib
          4. Verify: daemon log should NOT show "crsqlite extension failed to load"
          5. Verify CRDT sync works between M5 Max and M1 Pro

          If crsqlite binaries are not available for arm64:
          - Build from source: git clone, cargo build --release
          - Or document in ADR why we keep rsync as fallback
          Working dir: /Users/Roberdan/GitHub/ConvergioPlatform
        type: feature
        output_type: pr
        model: claude-opus-4-6
        executor_agent: task-executor
        validator_agent: thor-quality-assurance-guardian
        effort: 2
