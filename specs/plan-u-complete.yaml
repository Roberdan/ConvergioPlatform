  - id: W3
    name: "Ali Telegram + Voice E2E + Audio Routing"
    merge_mode: sync
    tasks:
      - id: T3-01
        ref: [F-08]
        do: |
          Implement Ali (Opus) via Telegram — async polling pattern.
          In daemon/src/kernel/voice_router.rs or a new ali_bridge.rs:

          When a question is too complex for local Mistral (engine.ask returns
          low-confidence or user explicitly says "chiedi ad ali"):
          1. POST /api/chat/session → get session_id
          2. POST /api/chat/message {session_id, content: question}
          3. Poll GET /api/chat/sessions/{session_id}/messages every 2s (max 30 rounds = 60s)
          4. When new AI message appears → extract text → return to caller
          5. On timeout → return "Ali non ha risposto in tempo. Riprova."

          Add VoiceIntent::EscalateToAli — triggered by keywords "chiedi ad ali",
          "ali", "opus", "cloud". This bypasses Mistral entirely.

          Regular AskAli still tries Mistral first (with MCP tools from W1).
          Working dir: /Users/Roberdan/GitHub/ConvergioPlatform
        type: feature
        output_type: pr
        model: claude-opus-4-6
        executor_agent: task-executor
        validator_agent: thor-quality-assurance-guardian
        effort: 3
        verify:
