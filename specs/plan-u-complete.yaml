          Create scripts/mesh/provision-node.sh — full node provisioning.
          Verifies ALL dependencies based on node role.
          Usage: provision-node.sh <ssh-alias> [--role kernel|executor|coordinator]

          For ALL roles:
          - git, cargo/rustc, python3
          - DB symlink correct ($HOME path)
          - peers.conf has this node
          - daemon builds and starts

          For kernel role additionally:
          - mlx_lm installed (Python venv)
          - Models downloaded (at least Mistral 3 8B)
          - Telegram token configured (~/.convergio/env)
          - crsqlite available
          - SoX (rec) for voice recording

          For executor role:
          - Claude Code or Copilot CLI available
          - SSH keys for mesh

          Fix ALL hardcoded paths in:
          - scripts/kernel/com.convergio.kernel.plist (uses __REPO_PATH__ placeholders — verify substitution)
          - scripts/kernel/com.convergio.sync-db.plist (4 hardcoded /Users/Roberdan — replace with __HOME__)
          - scripts/kernel/install-db-sync.sh (substitute placeholders at install time)
          Use $HOME, $(whoami), runtime resolution. NEVER /Users/Roberdan.
          Do NOT create a new provision script — extend existing scripts/mesh/mesh-provision-node.sh
          with role-based dependency checks.

          Working dir: /Users/Roberdan/GitHub/ConvergioPlatform
        type: feature
        output_type: pr
        model: claude-opus-4-6
        executor_agent: task-executor
        validator_agent: thor-quality-assurance-guardian
