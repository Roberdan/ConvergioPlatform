# ─────────────────────────────────────────────────────────────────────────────
# WAVE 1: Kernel MCP Intelligence
# ─────────────────────────────────────────────────────────────────────────────

waves:
  - id: W1
    name: "Kernel MCP — tools + function calling"
    merge_mode: sync
    tasks:
      - id: T1-01
        ref: [F-01, F-02]
        do: |
          Create daemon/src/kernel/tools.rs — kernel tool functions.
          Each tool calls daemon API and returns structured JSON string.
          NOT using full MCP protocol — simple Rust functions callable by engine.

          Tools:
          1. get_plans(url) → JSON: [{id, name, status, tasks_done, tasks_total}]
          2. get_plan_detail(url, id) → JSON: {plan with tasks and waves}
          3. get_costs(url) → JSON: {total_cost, today_cost, active_plans}
          4. get_node_status(url) → JSON: readiness checks
          5. get_kernel_status(url) → JSON: models, uptime, active_node
          6. get_agents(url) → JSON: running agents list
          7. restart_node(url, target) → triggers recovery, returns result

          Register in TOOL_REGISTRY: HashMap<&str, ToolFn>.
          Each function uses reqwest::blocking (called from spawn_blocking).
          Add pub mod tools to kernel/mod.rs.
          Working dir: /Users/Roberdan/GitHub/ConvergioPlatform
        type: feature
        output_type: pr
        model: claude-opus-4-6
        executor_agent: task-executor
        validator_agent: thor-quality-assurance-guardian
        effort: 2
        verify:
          - "test -f daemon/src/kernel/tools.rs"
          - "grep -q 'get_plans' daemon/src/kernel/tools.rs"
          - "cargo check --features kernel --manifest-path daemon/Cargo.toml"

      - id: T1-02
        ref: [F-03, F-04]
        do: |
          Update daemon/src/kernel/engine.rs ask() for tool-augmented inference.
          Mistral 3 Instruct supports tool calling in ChatML [INST] format.

          New ask() flow:
          1. Build prompt with tool descriptions + user question
          2. Call Mistral via bridge.infer()
          3. Parse response: if contains <tool_call>{"name":"X","arguments":{}} extract it
          4. Call the tool from tools.rs TOOL_REGISTRY
          5. Re-prompt Mistral with tool result
          6. Parse final answer, strip mlx_lm debug, return
          7. Max 2 tool call rounds (prevent loops)

          Remove gather_system_context() — replaced by tools.
          Keep strip_mlx_debug().

          Prompt template:
          [INST] Sei l'assistente Convergio. Hai questi strumenti:
          {tool_descriptions}
          Per usare uno strumento: <tool_call>{"name":"get_plans","arguments":{}}</tool_call>
          Domanda: {question}
          Rispondi in italiano con dati precisi. [/INST]
          Working dir: /Users/Roberdan/GitHub/ConvergioPlatform
        type: feature
        output_type: pr
        model: claude-opus-4-6
        executor_agent: task-executor
        validator_agent: thor-quality-assurance-guardian
        effort: 3
        verify:
          - "grep -q 'tool_call' daemon/src/kernel/engine.rs"
          - "! grep -q 'gather_system_context' daemon/src/kernel/engine.rs"
          - "cargo check --features kernel --manifest-path daemon/Cargo.toml"

      - id: T1-03
        ref: [F-01, F-02]
        do: |
          Update voice_router.rs route_ask_ali — back to /api/kernel/ask.
          Remove the hardcoded keyword matching in route_ask_ali.
          engine.ask() now uses tools, so /api/kernel/ask returns intelligent answers.
          route_ask_ali simply POSTs to /api/kernel/ask and returns the answer.
          Working dir: /Users/Roberdan/GitHub/ConvergioPlatform
        type: feature
        output_type: pr
        model: claude-opus-4-6
        executor_agent: task-executor
        validator_agent: thor-quality-assurance-guardian
        effort: 1
        verify:
          - "grep -q '/api/kernel/ask' daemon/src/kernel/voice_router.rs"
          - "cargo check --features kernel --manifest-path daemon/Cargo.toml"

