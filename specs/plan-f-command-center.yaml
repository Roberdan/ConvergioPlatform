name: "Plan F — Convergio Command Center"
version: "17.0.0"
project: convergio
description: >
  Three-phase plan: (1) Fix all security findings + performance issues from ADR-0109,
  (2) Code quality debt elimination + comprehensive testing + dashboard-legacy deletion,
  (3) Native SwiftUI macOS Tahoe 26 Command Center with Ghostty embedded terminal,
  Metal brain visualization, and full daemon API integration.
  Replaces Plan E dashboard concept with native app. Zero backward compatibility.
  Why: ADR-0109 audit scored 6.2/10 — 5 critical security, testing gaps, code debt.

requirements:
  - id: F-01
    title: Fix command injection SSE sync
    description: "Replace sh -c shell interpolation with Command::new(script).arg('sync').arg(&peer). Validate peer against Tailscale hostname pattern."
  - id: F-02
    title: Fix command injection SSE delegate
    description: "Allowlist for cli param (claude, copilot only). Shell-escape plan_id/task_id. Remove catch-all format!() RCE in sse_delegate_util.rs."
  - id: F-03
    title: Parameterize SQL queries
    description: "Replace format!() with rusqlite params![] in channels_context.rs db_cleanup() and db_reset()."
  - id: F-04
    title: Default auth to ON
    description: "Reverse None=>true in check_bearer(). Require --dev-mode CLI flag to disable. Bind 127.0.0.1 when auth disabled. Update main.rs arg parsing."
  - id: F-05
    title: Default-deny GET routes
    description: "Reverse middleware logic: all routes require auth by default. Only /api/health exempt. Remove PROTECTED_GET list."
  - id: F-06
    title: Constant-time token comparison
    description: "Add constant_time_eq crate. Replace == with constant_time_eq in Bearer token check."
  - id: F-07
    title: Async git_connector
    description: "Convert 3 methods (create_pr, merge_pr, pr_readiness) from reqwest::blocking to async reqwest::Client. Update GitConnector trait to async. Update release_agent.rs callers."
  - id: F-08
    title: Fix spawn_blocking+block_on
    description: "In ipc/socket.rs, replace spawn_blocking(block_on(dispatch)) with direct .await on dispatch()."
  - id: F-09
    title: Remove open_db pool bypass
    description: "Remove open_db() from state.rs. Migrate all callers (sync_ops.rs, overview.rs) to state.get_conn()."
  - id: F-10
    title: Fix thread::spawn in async handler
    description: "Replace std::thread::spawn with tokio::task::spawn_blocking + semaphore (max 4 concurrent) in overview.rs."
  - id: F-11
    title: Add DB indexes
    description: "Migration adding CREATE INDEX on tasks.status, tasks.wave_id_fk, plans.status in state_init.rs."
  - id: F-12
    title: Split 9 oversized files
    description: "Split cli_skill.rs(388), cli_agent.rs(310), api_agent_catalog.rs(297), cli_workspace.rs(270), api_mesh/handlers.rs(269), workspace/validation.rs(257), api_agent_triage.rs(255), api_dashboard/nightly.rs(254), api_plan_db.rs(251). Extract validators/formatters/helpers."
  - id: F-13
    title: Delete orphan cli_support
    description: "Delete cli_support.rs and cli_support_tests.rs. Confirmed not wired to main or any module."
  - id: F-14
    title: Replace all process::exit with Result
    description: "Replace 103 process::exit() across 23 files with Result returns. Single exit point in main(). Exit codes preserved via ExitCode."
  - id: F-15
    title: Standardize error handling repo-wide
    description: "Expand thiserror from 21 to all 145+ Result<T,String> files. Define CliError, IpcError, MeshError enums. Keep ApiError for HTTP. Remove anyhow from Cargo.toml."
  - id: F-16
    title: Add strict mode to platform scripts
    description: "Add set -euo pipefail to 8 scripts: convergio-{aliases,autopilot-helpers,autopilot,bus,import-agents,learnings,org,sync}.sh."
  - id: F-17
    title: Test mesh sync pipeline
    description: "Integration tests for 1356 LOC mesh sync (13 files). Cover: sync handshake, frame I/O, CRDT apply, batch ops, auth, DB ops."
  - id: F-18
    title: Test IPC handler
    description: "Tests for 664 LOC IPC handler (7 files). Cover: routing dispatch, auth validation, model operations, server lifecycle."
  - id: F-19
    title: Test 15 untested API handlers
    description: "Tests for: api_chat, api_coordinator, api_crdt, api_domain, api_evolution, api_github, api_heartbeat, api_ingest, api_metrics, api_peers, api_plans, api_plan_db_checkpoint, api_plan_db_query, api_audit, api_agents."
  - id: F-20
    title: Delete dashboard-legacy
    description: "Remove entire dashboard-legacy/ directory. Update any references in daemon, CLAUDE.md, agent docs."
  - id: F-21
    title: SwiftUI macOS app scaffold
    description: "Xcode 26.3 project, Swift 6.2.3, macOS Tahoe 26 deployment target. Liquid Glass (glassEffect), @Observable, @concurrent. App structure with sidebar navigation, Notarization config."
  - id: F-22
    title: Daemon API client layer
    description: "Swift async/await client for all 165 REST endpoints, 3 WS channels (brain, dashboard, pty), 7 SSE streams. Codable models. URLSession-based. Token auth via Keychain."
  - id: F-23
    title: Plan Dashboard view
    description: "Merge-based progress (waves merged/total), task kanban board, wave timeline, real-time updates via /ws/dashboard WebSocket."
  - id: F-24
    title: Agent Catalog view
    description: "List/enable/disable/create agents. Triage UI. Session monitor. Consumes /api/agents/* endpoints."
  - id: F-25
    title: Mesh Topology view
    description: "Live node map, heartbeat status, sync stats. Provision/delegate actions. Consumes /api/mesh/* + SSE streams."
  - id: F-26
    title: Evolution Metrics view
    description: "Proposals list, experiments, ROI charts (Chart3D), audit trail. Consumes /api/evolution/*."
  - id: F-27
    title: Cost Dashboard view
    description: "Token usage charts, model cost breakdown, run history table. Consumes /api/metrics/* + /api/runs/*."
  - id: F-28
    title: Ghostty embedded terminal
    description: "Native Ghostty integration via cmux pattern. Connected to daemon WS-PTY (/ws/pty). Local + remote mesh nodes. Tmux session management."
  - id: F-29
    title: Brain/Neural visualization Metal
    description: "Reimplement dashboard-legacy/brain-physics-wasm/ (362 LOC Rust: lib.rs, spatial.rs, step.rs) as SwiftUI + Metal. Force-directed graph, real-time agent/task nodes via /ws/brain."
  - id: F-30
    title: Native notifications
    description: "Thor results, task completion, mesh events, plan state changes. macOS Notification Center via UserNotifications framework."
  - id: F-31
    title: First-launch auth flow
    description: "Generate random token on first launch. Store in Keychain. Prompt user to set CONVERGIO_AUTH_TOKEN on daemon. Verify connection. Onboarding SwiftUI view."

acceptance_invariants:
  - "! grep -rn 'sh -c' daemon/src/server/sse.rs"
  - "! grep -rn 'format!.*{cli}' daemon/src/server/sse_delegate_util.rs"
  - "! grep -rn 'format!.*DELETE.*FROM' daemon/src/ipc/engine/channels_context.rs"
  - "grep -q 'constant_time_eq' daemon/src/server/middleware.rs"
  - "! grep -rn 'reqwest::blocking' daemon/src/workspace/git_connector.rs"
  - "! grep -rn 'spawn_blocking.*block_on' daemon/src/ipc/socket.rs"
  - "! grep -rn 'fn open_db' daemon/src/server/state.rs"
  - "! grep -rn 'std::thread::spawn' daemon/src/server/api_dashboard/overview.rs"
  - "grep -q 'CREATE INDEX' daemon/src/server/state_init.rs"
  - "! test -f daemon/src/cli_support.rs"
  - "! grep -rn 'process::exit' daemon/src/ --include='*.rs' | grep -v test | grep -v 'fn main'"
  - "! test -d dashboard-legacy"
  - "test -f CommandCenter/CommandCenter.xcodeproj/project.pbxproj"
  - "cd daemon && cargo test 2>&1 | grep 'test result: ok'"
  - "cd CommandCenter && xcodebuild -scheme CommandCenter build 2>&1 | grep 'BUILD SUCCEEDED'"

waves:
  # ══════════════════════════════════════════════
  # PHASE 1: SECURITY HARDENING + PERFORMANCE
  # ══════════════════════════════════════════════

  - id: W1
    name: "Security Critical — Command/SQL Injection"
    tasks:
      - id: T1-01
        do: >
          Fix command injection in daemon/src/server/sse.rs:96-106.
          Replace `format!("{script} sync {peer}")` passed to sh -c with
          `Command::new(script).arg("sync").arg(&peer)`.
          Add peer validation: must match `^[a-zA-Z0-9._-]+$` (Tailscale hostname pattern).
          Reject invalid peers with SSE error event.
          Write tests: valid peer, malicious peer (;rm -rf), empty peer.
        type: fix
        output_type: pr
        f_xx: [F-01]
        model: gpt-5.3-codex
        executor_agent: task-executor
        validator_agent: thor-quality-assurance-guardian
        effort: 1
        files: [daemon/src/server/sse.rs]
        verify:
          - "! grep -n 'sh.*-c' daemon/src/server/sse.rs"
          - "grep -q 'Command::new' daemon/src/server/sse.rs"
          - "cd daemon && cargo test sse -- 2>&1 | grep 'test result: ok'"
        test_criteria: "Tests cover valid peer, injection attempt (semicolon, pipe, backtick), empty peer"

      - id: T1-02
        do: >
          Fix command injection in daemon/src/server/sse_delegate_util.rs:28-43.
          Define ALLOWED_CLI allowlist: ["claude", "copilot"].
          Validate `cli` param against allowlist — reject unknown with error.
          Replace all format!() shell string construction with Command::new + .arg() chain.
          Remove the catch-all `_ => format!("cd {dir} && {cli} --plan {plan_id}")` — this is full RCE.
          Shell-escape plan_id, task_id, wave_id: reject if not matching `^[a-zA-Z0-9_-]+$`.
          Write tests: valid cli, invalid cli, injection in plan_id.
        type: fix
        output_type: pr
        f_xx: [F-02]
        model: gpt-5.3-codex
        executor_agent: task-executor
        validator_agent: thor-quality-assurance-guardian
        effort: 2
        files: [daemon/src/server/sse_delegate_util.rs]
        verify:
          - "! grep -n 'format!.*{cli}' daemon/src/server/sse_delegate_util.rs"
          - "grep -q 'ALLOWED_CLI' daemon/src/server/sse_delegate_util.rs"
          - "cd daemon && cargo test sse_delegate -- 2>&1 | grep 'test result: ok'"
        test_criteria: "Tests cover allowed CLI, rejected CLI, injection in plan_id/task_id"

      - id: T1-03
        do: >
          Fix SQL injection in daemon/src/ipc/engine/channels_context.rs.
          In db_cleanup() (line 158): replace format!("DELETE...'-{older_than_days} days'")
          with parameterized query using rusqlite params![older_than_days].
          SQLite datetime param: "DELETE FROM ipc_messages WHERE created_at < datetime('now', '-' || ?1 || ' days')".
          In db_reset() (line 178): table name from IPC_TABLES constant is safe but
          use explicit match for defense-in-depth instead of format!("DELETE FROM {table}").
          Write tests: cleanup with valid days, reset each table.
        type: fix
        output_type: pr
        f_xx: [F-03]
        model: gpt-5.3-codex
        executor_agent: task-executor
        validator_agent: thor-quality-assurance-guardian
        effort: 1
        files: [daemon/src/ipc/engine/channels_context.rs]
        verify:
          - "! grep -n 'format!.*DELETE' daemon/src/ipc/engine/channels_context.rs"
          - "grep -q 'params!' daemon/src/ipc/engine/channels_context.rs"
          - "cd daemon && cargo test channels_context -- 2>&1 | grep 'test result: ok'"
        test_criteria: "Tests cover cleanup with 30 days, reset each IPC table, verify row deletion"

      - id: T1-04
        do: >
          Add constant-time token comparison in daemon/src/server/middleware.rs:61.
          Add `constant_time_eq` crate to Cargo.toml.
          Replace `t == expected.as_str()` with `constant_time_eq(t.as_bytes(), expected.as_bytes())`.
          Write tests: correct token passes, wrong token fails, timing-safe (no early return).
        type: fix
        output_type: pr
        f_xx: [F-06]
        model: gpt-5.3-codex
        executor_agent: task-executor
        validator_agent: thor-quality-assurance-guardian
        effort: 1
        files: [daemon/src/server/middleware.rs, daemon/Cargo.toml]
        verify:
          - "grep -q 'constant_time_eq' daemon/src/server/middleware.rs"
          - "grep -q 'constant_time_eq' daemon/Cargo.toml"
          - "cd daemon && cargo test middleware -- 2>&1 | grep 'test result: ok'"
        test_criteria: "Tests verify correct token accepted, wrong token rejected, empty token rejected"

  - id: W2
    name: "Auth Hardening + DB Indexes"
    tasks:
      - id: T2-01
        do: >
          Complete auth hardening in daemon/src/server/middleware.rs (F-04 + F-05 combined — same file).
          Part A (F-04): Reverse check_bearer logic: when CONVERGIO_AUTH_TOKEN is None, return false (deny all).
          Add --dev-mode flag to daemon CLI (main.rs clap args) that sets AUTH_DISABLED OnceLock.
          When dev-mode AND no token: bind to 127.0.0.1 only (update server::run bind_addr logic).
          When dev-mode: log WARNING "Auth disabled — dev mode, binding to localhost only".
          Part B (F-05): Remove PROTECTED_GET list. Reverse needs_auth() logic: define EXEMPT_ROUTES.
          EXEMPT_ROUTES = ["/api/health"]. All other routes (GET included) require Bearer token.
          In needs_auth(): return true for everything except EXEMPT_ROUTES (when not in dev-mode).
          Update ALL existing tests that depend on no-auth behavior to use dev-mode flag.
          Tests: no token + no dev-mode = 401 on all routes; dev-mode = allows unauthenticated;
          token set = normal auth; /api/health accessible without auth; /api/plans returns 401 without token.
        type: fix
        output_type: pr
        f_xx: [F-04, F-05]
        model: gpt-5.3-codex
        executor_agent: task-executor
        validator_agent: thor-quality-assurance-guardian
        effort: 3
        files: [daemon/src/server/middleware.rs, daemon/src/main.rs, daemon/src/server/mod.rs]
        verify:
          - "grep -q 'dev.mode\\|dev_mode' daemon/src/main.rs"
          - "! grep -q 'PROTECTED_GET' daemon/src/server/middleware.rs"
          - "grep -q 'EXEMPT_ROUTES\\|exempt' daemon/src/server/middleware.rs"
          - "cd daemon && cargo test middleware -- 2>&1 | grep 'test result: ok'"
          - "cd daemon && cargo test 2>&1 | grep 'test result: ok'"
        test_criteria: "No-token+no-dev-mode=401. Dev-mode=unauthenticated. /api/health exempt. All other GET routes require auth."

      - id: T2-02
        do: >
          Add DB indexes migration in daemon/src/server/state_init.rs.
          New migration block after existing migrations:
          CREATE INDEX IF NOT EXISTS idx_tasks_status ON tasks(status);
          CREATE INDEX IF NOT EXISTS idx_tasks_wave_id ON tasks(wave_id_fk);
          CREATE INDEX IF NOT EXISTS idx_plans_status ON plans(status);
          Also add: idx_tasks_plan_id ON tasks(plan_id), idx_waves_plan_id ON waves(plan_id).
          Write test verifying indexes exist after migration.
        type: fix
        output_type: pr
        f_xx: [F-11]
        model: gpt-5.3-codex
        executor_agent: task-executor
        validator_agent: thor-quality-assurance-guardian
        effort: 1
        files: [daemon/src/server/state_init.rs]
        verify:
          - "grep -q 'idx_tasks_status' daemon/src/server/state_init.rs"
          - "grep -q 'idx_plans_status' daemon/src/server/state_init.rs"
          - "cd daemon && cargo test state_init -- 2>&1 | grep 'test result: ok'"
        test_criteria: "Test creates in-memory DB, runs migrations, verifies all 5 indexes exist via PRAGMA index_list"

  - id: W3
    name: "Async Performance Fixes"
    tasks:
      - id: T3-01
        do: >
          Convert git_connector.rs from blocking to async in daemon/src/workspace/git_connector.rs.
          Replace reqwest::blocking::Client with reqwest::Client in create_pr(), merge_pr(), pr_readiness().
          Make all 3 methods async fn. Update GitConnector trait to use async_trait or native async fn in trait (Rust 2024).
          Add 30s timeout on all requests.
          Update callers in release_agent.rs (line 127-160) to .await.
          Update test mocks for async trait.
          Also replace Result<T, String> with a GitError thiserror enum (aligns with F-15).
        type: fix
        output_type: pr
        f_xx: [F-07]
        model: gpt-5.3-codex
        executor_agent: task-executor
        validator_agent: thor-quality-assurance-guardian
        effort: 3
        files: [daemon/src/workspace/git_connector.rs, daemon/src/workspace/release_agent.rs]
        verify:
          - "! grep -n 'reqwest::blocking' daemon/src/workspace/git_connector.rs"
          - "grep -q 'async fn create_pr' daemon/src/workspace/git_connector.rs"
          - "cd daemon && cargo test workspace -- 2>&1 | grep 'test result: ok'"
        test_criteria: "Tests mock HTTP responses for create_pr, merge_pr, pr_readiness. Verify timeout handling. Verify async trait works."

      - id: T3-02
        do: >
          Fix spawn_blocking+block_on in daemon/src/ipc/socket.rs:83-84.
          Replace `tokio::task::spawn_blocking(move || { Handle::current().block_on(eng.dispatch(request)) })`
          with direct `eng.dispatch(request).await`.
          Remove the needs_async branching if both paths end up using await.
          Verify all callers handle the Result properly.
          Write test for IPC dispatch path.
        type: fix
        output_type: pr
        f_xx: [F-08]
        model: gpt-5.3-codex
        executor_agent: task-executor
        validator_agent: thor-quality-assurance-guardian
        effort: 1
        files: [daemon/src/ipc/socket.rs]
        verify:
          - "! grep -n 'spawn_blocking' daemon/src/ipc/socket.rs"
          - "! grep -n 'block_on' daemon/src/ipc/socket.rs"
          - "cd daemon && cargo test ipc::socket -- 2>&1 | grep 'test result: ok'"
        test_criteria: "Test IPC socket dispatch path with mock engine, verify async execution without blocking"

      - id: T3-03
        do: >
          Remove open_db() bypass in daemon/src/server/state.rs:47-53.
          Delete the open_db() method entirely.
          Find ALL callers (grep for open_db): sync_ops.rs, overview.rs, and any others.
          Replace each call with state.get_conn() — convert PlanDb usage to direct rusqlite connection.
          If callers need PlanDb specifically, add a from_pooled_conn() constructor to PlanDb.
          Write test verifying pool is used for all DB access.
        type: fix
        output_type: pr
        f_xx: [F-09]
        model: gpt-5.3-codex
        executor_agent: task-executor
        validator_agent: thor-quality-assurance-guardian
        effort: 2
        files: [daemon/src/server/state.rs, daemon/src/server/api_mesh/sync_ops.rs, daemon/src/server/api_dashboard/overview.rs]
        verify:
          - "! grep -n 'fn open_db' daemon/src/server/state.rs"
          - "! grep -rn 'open_db()' daemon/src/server/"
          - "cd daemon && cargo test 2>&1 | grep 'test result: ok'"
        test_criteria: "All DB access goes through pool. No direct Connection::open in handlers."

      - id: T3-04
        do: >
          Fix std::thread::spawn in daemon/src/server/api_dashboard/overview.rs:66,72.
          Replace std::thread::spawn(move || refresh_lines_cache(&db_path))
          with tokio::task::spawn_blocking wrapped in a semaphore (max 4 concurrent).
          Add static REFRESH_SEMAPHORE: Semaphore = Semaphore::const_new(4).
          Use try_acquire — if no permit available, skip refresh (cache is still valid from last run).
          Write test verifying concurrent refresh is bounded.
        type: fix
        output_type: pr
        f_xx: [F-10]
        model: gpt-5.3-codex
        executor_agent: task-executor
        validator_agent: thor-quality-assurance-guardian
        effort: 1
        files: [daemon/src/server/api_dashboard/overview.rs]
        verify:
          - "! grep -n 'std::thread::spawn' daemon/src/server/api_dashboard/overview.rs"
          - "grep -q 'Semaphore\\|semaphore' daemon/src/server/api_dashboard/overview.rs"
          - "cd daemon && cargo test overview -- 2>&1 | grep 'test result: ok'"
        test_criteria: "Test semaphore bounds concurrent refreshes. Verify spawn_blocking used instead of thread::spawn."

  # ══════════════════════════════════════════════
  # PHASE 2: CODE QUALITY + TESTING
  # ══════════════════════════════════════════════

  - id: W4
    name: "File Splits A — Largest 4 Files"
    tasks:
      - id: T4-01
