      - id: T4-04
        do: >
          Split cli_workspace.rs (270 lines) into two modules.
          Identify logical split (likely: enum+dispatch vs format/output helpers).
          Extract to cli_workspace_format.rs or cli_workspace_handlers.rs.
          Both files <250 lines.
        type: refactor
        output_type: pr
        f_xx: [F-12]
        model: gpt-5.3-codex
        executor_agent: task-executor
        validator_agent: thor-quality-assurance-guardian
        effort: 1
        files: [daemon/src/cli_workspace.rs, daemon/src/main.rs]
        verify:
          - "wc -l < daemon/src/cli_workspace.rs | awk '{exit ($1 > 250)}'"
          - "cd daemon && cargo test cli_workspace -- 2>&1 | grep 'test result: ok'"
        test_criteria: "Both files under 250 lines. CLI behavior unchanged."

  - id: W5
    name: "File Splits B + Orphan Cleanup"
    tasks:
      - id: T5-01
        do: >
          Split api_mesh/handlers.rs (269 lines) and workspace/validation.rs (257 lines).
          handlers.rs: extract sync-related handlers into handlers_sync.rs.
          validation.rs: extract rule implementations into validation_rules.rs.
          Both originals and new files <250 lines.
        type: refactor
