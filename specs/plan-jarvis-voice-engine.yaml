waves:
  - id: "W1"
    name: "Voxtral TTS + TtsEngine Cleanup"
    estimated_hours: 8
    tasks:
      - id: "T1-01"
        title: "Implement Voxtral TTS backend and reorder priority"
        type: feature
        priority: P0
        description: |
          Implement speak_via_voxtral() in daemon/src/kernel/tts.rs.
          Replace placeholder (lines 198-217) with real mlx-audio invocation.
          Same pattern as speak_via_qwen3: python -m mlx_audio.tts.generate
          --model mlx-community/Voxtral-4B-TTS-2603-mlx-4bit --text TEXT --voice VOICE --output_path DIR.
          Voice: it_female for Italian, it_male as alt. Fix voxtral_available() probe.
          Use AppleFmBridge::resolve_python(). Reorder priority: Voxtral > Qwen3 > macOS say.
          Remove all voices except it_male and it_female. Update tts_tests.rs.
        model: claude-opus-4.6
        output_type: pr
        validator_agent: thor
        effort_level: 2
        files:
          - daemon/src/kernel/tts.rs
          - daemon/src/kernel/tts_tests.rs
        verify:
          - "cd daemon && cargo check"
          - "cd daemon && cargo test -- kernel::tts"
          - "grep -q 'Voxtral-4B-TTS-2603' daemon/src/kernel/tts.rs"
          - "grep -q 'mlx_audio.tts.generate' daemon/src/kernel/tts.rs"
        test_criteria: "cargo test -- kernel::tts passes. Voxtral is primary backend."

      - id: "T1-02"
        title: "Update setup-models.sh for Voxtral TTS"
        type: feature
        priority: P1
        description: |
          Update scripts/kernel/setup-models.sh: install mlx-audio from git main
          (pip install git+https://github.com/Blaizzy/mlx-audio.git), download Voxtral model,
          add verification, remove old Voxtral-Mini-3B-2507-4bit entry.
        model: claude-opus-4.6
        output_type: pr
        validator_agent: thor
        effort_level: 1
        files:
          - scripts/kernel/setup-models.sh
        verify:
          - "bash -n scripts/kernel/setup-models.sh"
          - "grep -q 'Voxtral-4B-TTS-2603' scripts/kernel/setup-models.sh"
          - "grep -q 'Blaizzy/mlx-audio' scripts/kernel/setup-models.sh"
        test_criteria: "Script valid. Voxtral model download and mlx-audio git install present."

      - id: "T1-03"
        title: "Remove voice/tts.rs duality — use kernel TtsEngine"
        type: fix
        priority: P0
        description: |
          Remove daemon/src/voice/tts.rs (52 lines, macOS-say-only duplicate).
          Update voice/mod.rs: remove pub mod tts. Update voice/pipeline.rs:
          change import to crate::kernel::tts::TtsEngine. Fix call sites.
          Update pipeline_tests.rs if needed.
        model: claude-opus-4.6
        output_type: pr
        validator_agent: thor
        effort_level: 1
        files:
          - daemon/src/voice/tts.rs
          - daemon/src/voice/mod.rs
          - daemon/src/voice/pipeline.rs
        verify:
          - "cd daemon && cargo check"
          - "! test -f daemon/src/voice/tts.rs"
          - "grep -q 'crate::kernel::tts' daemon/src/voice/pipeline.rs"
        test_criteria: "voice/tts.rs deleted. pipeline.rs uses kernel TtsEngine. cargo check passes."

  - id: "W2"
    name: "Cargo Dependencies"
    depends_on: "W1"
    estimated_hours: 4
    tasks:
      - id: "T2-01"
        title: "Add cpal, webrtc-vad, whisper-rs, hound, ringbuf under voice feature"
        type: feature
        priority: P1
        description: |
          Add to daemon/Cargo.toml: cpal, webrtc-vad, whisper-rs (with metal feature),
          hound, ringbuf as optional deps. Feature voice = [...]. NOT in default features
          (CI without audio hardware). Check crates.io for latest versions.
        model: claude-opus-4.6
        output_type: pr
        validator_agent: thor
        effort_level: 1
        files:
          - daemon/Cargo.toml
        verify:
          - "cd daemon && cargo check --features voice"
          - "grep -q 'cpal' daemon/Cargo.toml"
          - "grep -q 'whisper-rs' daemon/Cargo.toml"
          - "grep -q 'webrtc-vad' daemon/Cargo.toml"
        test_criteria: "cargo check --features voice succeeds. All 5 crates listed."

  - id: "W3"
    name: "Module Rewrites — VAD + Whisper + AudioCapture + WakeWord"
    depends_on: "W2"
    estimated_hours: 16
    tasks:
      - id: "T3-01"
        title: "Feature-gate pipeline.rs and rewrite vad.rs with webrtc-vad"
        type: feature
        priority: P1
        description: |
          FIRST: Add #[cfg(feature = "voice_pipeline")] to pipeline module in voice/mod.rs
          to prevent compilation breakage during API rewrites.
          Then rewrite daemon/src/voice/vad.rs with webrtc-vad: Aggressiveness::VeryAggressive,
          16kHz mono i16 frames (30ms = 480 samples), is_speech() method.
          Energy-based fallback if init fails. Rewrite vad_tests.rs.
        model: claude-opus-4.6
        output_type: pr
        validator_agent: thor
        effort_level: 2
        files:
          - daemon/src/voice/vad.rs
          - daemon/src/voice/mod.rs
        verify:
          - "cd daemon && cargo test -- voice::vad"
          - "cd daemon && cargo check --features voice"
        test_criteria: "VAD tests pass. cargo check --features voice succeeds with pipeline disabled."

      - id: "T3-02"
        title: "Rewrite whisper.rs with whisper-rs native Rust STT"
        type: feature
        priority: P1
        description: |
          Rewrite daemon/src/voice/whisper.rs with whisper-rs (whisper.cpp bindings).
          Load model via WhisperContext. Resolve path from env or default.
          transcribe(audio: &[f32], sample_rate: u32) -> Result<Transcription>.
          Metal GPU, 30s timeout. Rewrite whisper_tests.rs.
        model: claude-opus-4.6
        output_type: pr
        validator_agent: thor
        effort_level: 3
        files:
          - daemon/src/voice/whisper.rs
          - daemon/src/voice/types.rs
        verify:
          - "cd daemon && cargo test -- voice::whisper"
          - "cd daemon && cargo check --features voice"
        test_criteria: "Whisper tests pass. Model-not-found returns error not panic."

      - id: "T3-03"
        title: "Create audio_capture.rs with cpal for Rust-native mic capture"
        type: feature
        priority: P1
        description: |
          Create daemon/src/voice/audio_capture.rs using cpal. 16kHz mono i16.
          ringbuf for lock-free producer/consumer. AudioCapture struct with start/stop/take_frames.
          Graceful macOS TCC permission denial. Under 250 lines. Wire in mod.rs.
        model: claude-opus-4.6
        output_type: pr
        validator_agent: thor
        effort_level: 2
        files:
          - daemon/src/voice/audio_capture.rs
          - daemon/src/voice/mod.rs
        verify:
          - "cd daemon && cargo check --features voice"
          - "cd daemon && cargo test -- voice::audio_capture"
        test_criteria: "AudioCapture compiles. Tests pass. Under 250 lines."

      - id: "T3-04"
        title: "Rewrite wake_word.rs with VAD + Whisper micro-transcription"
        type: feature
        priority: P1
        description: |
          Rewrite daemon/src/voice/wake_word.rs. Buffer 1-2s on VAD speech detect,
          run whisper-rs, fuzzy match hey convergio (Levenshtein <= 3).
          WakeWordDetector with feed_audio() -> Option<WakeWordEvent>.
          Rewrite wake_word_tests.rs.
        model: claude-opus-4.6
        output_type: pr
        validator_agent: thor
        effort_level: 3
        files:
          - daemon/src/voice/wake_word.rs
          - daemon/src/voice/mod.rs
        verify:
          - "cd daemon && cargo test -- voice::wake_word"
          - "cd daemon && cargo check --features voice"
        test_criteria: "Wake word tests pass. Default keyword is hey convergio."

  - id: "W4"
    name: "Voice Pipeline + State Machine"
    depends_on: "W3"
    estimated_hours: 8
    tasks:
      - id: "T4-01"
        title: "Rewrite pipeline.rs — full conversation loop with all W3 modules"
        type: feature
        priority: P0
        description: |
          Remove voice_pipeline feature gate. Restore normal #[cfg(feature = "voice")] on pipeline.
          State machine: Idle > WakeDetected > Listening > Processing > Speaking > Idle.
          Add WakeDetected to VoiceState in types.rs.
          Use: kernel::tts::TtsEngine, kernel::engine::KernelEngine, voice::whisper,
          voice::vad, voice::wake_word, voice::audio_capture.
          VoicePipeline::run() spawns tokio task. Shutdown via watch channel.
          Rewrite pipeline_tests.rs. Under 250 lines, split to pipeline_helpers.rs if needed.
        model: claude-opus-4.6
        output_type: pr
        validator_agent: thor
        effort_level: 3
        files:
          - daemon/src/voice/pipeline.rs
          - daemon/src/voice/types.rs
          - daemon/src/voice/mod.rs
        verify:
          - "cd daemon && cargo test -- voice::pipeline"
          - "cd daemon && cargo check --features voice,kernel"
          - "grep -q 'WakeDetected' daemon/src/voice/types.rs"
        test_criteria: "Pipeline tests pass. State transitions correct. Under 250 lines."

  - id: "W5"
    name: "API Wiring + Integration Tests"
    depends_on: "W4"
    estimated_hours: 8
    tasks:
      - id: "T5-01"
        title: "Wire pipeline into daemon startup and API endpoints"
        type: feature
        priority: P1
        description: |
          Spawn VoicePipeline::run() in server routes when voice+kernel features active.
          Update existing cli_voice.rs (66 lines, already has start/stop/status/test).
          Add /api/voice/ endpoints in api_routes.rs. Feature-gate with voice.
        model: claude-opus-4.6
        output_type: pr
        validator_agent: thor
        effort_level: 2
        files:
          - daemon/src/server/routes/mod.rs
          - daemon/src/server/routes/api_routes.rs
          - daemon/src/cli_voice.rs
        verify:
          - "cd daemon && cargo check --features voice,kernel"
          - "grep -q 'voice' daemon/src/server/routes/api_routes.rs"
        test_criteria: "cargo check passes. API endpoints registered. CLI updated."

      - id: "T5-02"
        title: "Integration tests for voice engine"
        type: test
        priority: P1
        description: |
          Create daemon/src/voice/integration_tests.rs with 4+ tests:
          TtsEngine Voxtral command args, pipeline state transitions,
          VAD>wake>STT flow with mocked frames, API JSON shape.
          Realistic data only. Hardware tests use #[ignore]. Wire in mod.rs.
        model: claude-opus-4.6
        output_type: pr
        validator_agent: thor
        effort_level: 2
        files:
          - daemon/src/voice/integration_tests.rs
          - daemon/src/voice/mod.rs
        verify:
          - "cd daemon && cargo test -- voice::integration_tests"
        test_criteria: "Integration tests pass. At least 4 test functions."

  - id: "WF"
    name: "Closure"
    depends_on: "W5"
    estimated_hours: 8
    tasks:
      - id: "TF-tests"
        title: "Full test suite — fix regressions"
        type: test
        priority: P0
        description: "Run cargo test --features voice,kernel. Fix any failures."
        model: claude-opus-4.6
        output_type: pr
        validator_agent: thor
        effort_level: 1
        files:
          - daemon/src/kernel/tts.rs
          - daemon/src/voice/pipeline.rs
        verify:
          - "cd daemon && cargo test --features voice,kernel"
        test_criteria: "All tests pass with 0 failures."

      - id: "TF-doc"
        title: "ADR, TROUBLESHOOTING, CHANGELOG, capabilities doc"
        type: doc
        priority: P1
        description: |
          ADR-0123-jarvis-voice-engine.md, TROUBLESHOOTING voice section,
          CHANGELOG entry, convergio-capabilities.md Voice Engine section.
        model: claude-opus-4.6
        output_type: pr
        validator_agent: doc-validator
        effort_level: 1
        files:
          - docs/adr/ADR-0123-jarvis-voice-engine.md
          - TROUBLESHOOTING.md
          - CHANGELOG.md
        verify:
          - "test -f docs/adr/ADR-0123-jarvis-voice-engine.md"
          - "grep -qi 'voice' TROUBLESHOOTING.md"
          - "grep -qi 'voice' CHANGELOG.md"
        test_criteria: "All 4 docs updated."

      - id: "TF-pr"
        title: "Create PR for voice engine"
        type: feature
        priority: P1
        description: "Branch feat/jarvis-voice-engine. Squash merge after CI green."
        model: claude-opus-4.6
        output_type: pr
        validator_agent: thor
        effort_level: 1
        files: []
        verify:
          - "gh pr list --state open --head feat/jarvis-voice-engine"
        test_criteria: "PR created. CI passes."

      - id: "TF-deploy-verify"
        title: "Verify deployment on M1 Pro kernel node"
        type: test
        priority: P1
        description: |
          SSH m1Pro: pull, build --release --features voice,kernel,
          verify /api/voice/status, /api/kernel/speak, mlx-audio, Voxtral model.
        model: claude-opus-4.6
        output_type: pr
        validator_agent: thor
        effort_level: 1
        files: []
        verify:
          - "ssh m1Pro 'ls ~/.cache/huggingface/hub/models--mlx-community--Voxtral-4B-TTS-2603-mlx-4bit/snapshots/*/voice_embedding/it_female.safetensors'"
        test_criteria: "Build succeeds. APIs respond. Model cached."
