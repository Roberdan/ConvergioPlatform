waves:
  - id: W1
    name: "Foundation — MLX + watchdog"
    tasks:
      - id: T1-01
        do: |
          Create daemon/src/kernel/mod.rs with conditional compilation (#[cfg(feature = "kernel")]).
          Add "kernel" feature to daemon/Cargo.toml (default = off).
          Implement MLX model loading: spawn mlx_lm subprocess, health check, classify endpoint.
          POST /api/kernel/classify — input: situation JSON, output: {severity, action, reason}.
          GET /api/kernel/status — {models_loaded, ram_gb, uptime_secs, active_node, last_check}.
          Wire into daemon/src/server/routes/mod.rs (behind feature gate).
          Config env: KERNEL_MODEL, KERNEL_ENABLED.
          Working dir: /Users/Roberdan/GitHub/ConvergioPlatform
        type: feature
        output_type: pr
        model: claude-opus-4-6
        executor_agent: task-executor
        validator_agent: thor-quality-assurance-guardian
        effort: 3
        verify:
          - "cargo check --features kernel --manifest-path daemon/Cargo.toml"
          - "cargo test --features kernel kernel::tests --manifest-path daemon/Cargo.toml"
          - "grep -q 'cfg.*feature.*kernel' daemon/src/kernel/mod.rs"
          - "grep -q '/api/kernel/status' daemon/src/server/routes/api_routes.rs"

      - id: T1-02
        do: |
          Create daemon/src/kernel/monitor.rs.
          Background tokio::spawn loop every 30s:
          1. Poll all mesh peers /api/health (from peers.conf Tailscale IPs)
          2. Check local daemon /api/health
          3. Detect stalled agents: /api/ipc/agents — idle >5min with assigned task
          4. Detect rate limits: /api/ipc/route-history — 429 count in last 5min
          5. Check disk space + RAM pressure (sysinfo crate)
          6. Detect compaction risk: context window near limit → auto checkpoint
          Classify each via Mistral function calling → OK/WARN/CRITICAL.
          Store in kernel_events table (CREATE TABLE in migration).
          On state change → trigger communicate (T1-04 wiring point).
          Working dir: /Users/Roberdan/GitHub/ConvergioPlatform
        type: feature
        output_type: pr
        model: claude-opus-4-6
        executor_agent: task-executor
        validator_agent: thor-quality-assurance-guardian
        effort: 3
        verify:
          - "cargo test --features kernel kernel::monitor --manifest-path daemon/Cargo.toml"
          - "test -f daemon/src/kernel/monitor.rs"
          - "grep -q 'kernel_events' daemon/src/kernel/monitor.rs"

      - id: T1-03
        do: |
          Create daemon/src/kernel/verify.rs.
          Hook into POST /api/plan-db/task/update — before marking "done":
          1. Check declared output files exist (glob on execution host via mesh /api/mesh/exec)
          2. Check tests pass (cargo test exit 0, via mesh exec if remote)
          3. Check build succeeds (cargo check exit 0)
          4. Check git status --porcelain is empty in worktree
          If ANY check fails → block update, log in kernel_verifications table, notify.
          Mistral classifies failure: {action: "retry"|"escalate"|"block", reason: "..."}.
          Evidence stored: timestamp, task_id, checks[], pass/fail per check.
          Working dir: /Users/Roberdan/GitHub/ConvergioPlatform
        type: feature
        output_type: pr
        model: claude-opus-4-6
        executor_agent: task-executor
        validator_agent: thor-quality-assurance-guardian
        effort: 3
        verify:
          - "cargo test --features kernel kernel::verify --manifest-path daemon/Cargo.toml"
          - "test -f daemon/src/kernel/verify.rs"
          - "grep -q 'kernel_verifications' daemon/src/kernel/verify.rs"

      - id: T1-04
        do: |
          Create daemon/src/kernel/recover.rs.
          Deterministic recovery chain (if/else, NOT LLM-decided):
          CRITICAL: checkpoint save → SSH restart peer daemon → reap zombies → notify
          WARN (>3 cycles): log + notify
          OK: log only
          SSH restart: use existing mesh SSH infrastructure (daemon/src/mesh/ssh.rs).
          Notify channels (ordered): local audio (T2-02 stub) → Telegram (T3-01 stub) → ntfy.sh fallback.
          ntfy.sh: curl -d "{message}" ntfy.sh/{topic} (simple HTTP, no dependency).
          Config: KERNEL_NTFY_TOPIC, KERNEL_NOTIFY_CHANNELS=local,telegram,ntfy
          Wire recover into monitor loop (on state change callback).
          Working dir: /Users/Roberdan/GitHub/ConvergioPlatform
        type: feature
        output_type: pr
        model: claude-opus-4-6
        executor_agent: task-executor
        validator_agent: thor-quality-assurance-guardian
        effort: 2
        verify:
          - "cargo test --features kernel kernel::recover --manifest-path daemon/Cargo.toml"
          - "test -f daemon/src/kernel/recover.rs"
          - "grep -q 'ntfy' daemon/src/kernel/recover.rs"

      - id: T1-05
        do: |
          Add kernel CLI subcommands to daemon/src/cli_kernel.rs:
          cvg kernel status — query GET /api/kernel/status, format table output
          cvg kernel start — POST /api/kernel/start (load models, begin monitor loop)
          cvg kernel stop — POST /api/kernel/stop (unload models, stop loop)
          cvg kernel logs [--level WARN] [--limit 50] — query kernel_events table
          cvg kernel test — run all monitor checks once, report results table
          cvg kernel here — POST /api/kernel/active-node (set THIS node as audio target)
          cvg kernel say "text" — POST /api/kernel/speak (debug TTS, plays on active node)
          Wire into daemon/src/main.rs CLI dispatch (Commands enum).
          Working dir: /Users/Roberdan/GitHub/ConvergioPlatform
        type: feature
        output_type: pr
        model: claude-opus-4-6
        executor_agent: task-executor
        validator_agent: thor-quality-assurance-guardian
        effort: 2
        verify:
          - "cargo check --features kernel --manifest-path daemon/Cargo.toml"
          - "test -f daemon/src/cli_kernel.rs"
          - "grep -q 'kernel' daemon/src/main.rs"

