# Plan Q — Convergio Kernel
# Local LLM watchdog module in daemon. M1 Pro always-on.
# Mistral 3 8B + Voxtral TTS 4B + Whisper small. All MLX, ~9GB.
# Monitor + Verify + Recover + Voice + Telegram bidirezionale.

name: "Plan Q — Convergio Kernel"
project_id: convergio
plan_id: 729
priority: P1
execution_mode: serial
tags: [kernel, local-llm, watchdog, voice, tts, stt, telegram]

description: >
  New daemon module (daemon/src/kernel/) activated with --kernel flag.
  Loads 3 local models via MLX on M1 Pro (always-on, ~9GB RAM).
  Same binary, same API, conditional compilation.
  Four capabilities: Monitor, Verify, Recover, Communicate.
  Two output channels: local audio (routed to active mesh node) + Telegram (text + voice).
  Bidirezionale: kernel speaks AND listens, locally and via Telegram.

architecture: |
  daemon/src/kernel/ — #[cfg(feature = "kernel")]
  M1 Pro (--kernel): Mistral 3 8B Q4 (~5GB) + Voxtral TTS 4B (~3GB) + Whisper small (~1GB)
  M5 Max (no --kernel): unchanged, exposes /api/kernel/play for audio routing
  Audio: generated on M1 Pro → streamed to active node via mesh → local playback
  Telegram: Bot API (reqwest, no SDK) → text + OGG voice notes → bidirezionale
  Principle: kernel classifies (LLM), kernel acts (deterministic rules). Never LLM-decided actions.

# ─────────────────────────────────────────────────────────────────────────────

