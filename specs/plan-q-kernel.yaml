    defined_by: user
  - description: "Monitor detects peer failure within 60s"
    verify: "cargo test --features kernel kernel::monitor::test_detect_peer_failure"
    defined_by: collaborative
  - description: "Verify blocks task without evidence"
    verify: "cargo test --features kernel kernel::verify::test_block_without_evidence"
    defined_by: user
  - description: "Recover restarts daemon and sends notification"
