name: "Plan Q — Convergio Kernel"
description: |
  New daemon module: daemon/src/kernel/
  Activated with --kernel flag. Loads 3 local models via MLX on M1 Pro.
  Same daemon binary, same API. Zero cloud for inference.
  Four capabilities: Monitor, Verify, Recover, Communicate.
  Three models: Mistral 3 8B (brain), Voxtral TTS 4B (voice out), Whisper (voice in).
  Two channels: local audio (plays on active mesh node) + Telegram (text + voice).
  Bidirezionale: kernel parla E ascolta, sia localmente che via Telegram.
project: ConvergioPlatform
plan_id: 729
priority: P1
tags: [kernel, local-llm, watchdog, voice, tts, stt, telegram, daemon-module]
model_strategy: local-only

architecture: |
  The kernel is a daemon module, NOT a separate process.
  daemon/src/kernel/ — loaded when --kernel flag is passed.

  ┌─────────────────────────────────────────────────────────┐
  │ M1 Pro daemon (--kernel, always-on, ~9GB)               │
  │                                                         │
  │  Mistral 3 8B Q4 (~5GB) — classify, function calling    │
  │  Voxtral TTS 4B  (~3GB) — generate speech (italiano)    │
  │  Whisper small    (~1GB) — transcribe speech             │
  │                                                         │
  │  Monitor → Verify → Recover → Communicate               │
  └──────────┬──────────────────────┬───────────────────────┘
             │ mesh (Tailscale)     │ HTTPS
             ▼                     ▼
  ┌──────────────────┐   ┌─────────────────────┐
  │ M5 Max daemon    │   │ Telegram Bot API     │
  │ (no --kernel)    │   │                     │
  │                  │   │ Send: text + voice  │
  │ /api/kernel/play │   │ Recv: text + voice  │
  │ → afplay locale  │   │ Webhook → daemon    │
  └──────────────────┘   └─────────────────────┘

  Audio routing: kernel genera audio → invia al nodo attivo via mesh → play locale.
  Nodo attivo = ultimo nodo con heartbeat + TTY attivo, o esplicito `cvg kernel here`.

  Telegram: il canale "fuori casa". Stessi comandi, stesse risposte.
  Vocali Telegram in ingresso → download → Whisper → intent → risposta testo + vocale.

waves:
  - id: W1
    name: "Foundation — MLX + Mistral 3 8B watchdog"
    tasks:
      - id: T1-01
        title: "MLX inference engine in daemon"
        type: feature
        description: |
          Add daemon/src/kernel/mod.rs module.
          Load Mistral 3 8B Q4 via mlx-rs or subprocess (mlx_lm.generate).
          Expose: POST /api/kernel/classify — takes situation JSON, returns action.
          Health: GET /api/kernel/status — model loaded, RAM usage, uptime, active_node.
          Config: KERNEL_MODEL=mistral-3-8b-q4, KERNEL_ENABLED=true.
          Must start in <10s, use <5GB RAM.
          Conditional compilation: #[cfg(feature = "kernel")] — no overhead when disabled.

      - id: T1-02
        title: "Monitor loop — daemon + mesh health"
        type: feature
        description: |
          Background task (tokio::spawn) every 30s:
          1. Poll all mesh peers /api/health (via Tailscale IPs from peers.conf)
          2. Poll local daemon /api/health
          3. Check process count (ps aux | grep convergio)
          4. Check disk space, RAM pressure
          5. Detect stalled agents: /api/ipc/agents — any agent idle >5min with task assigned?
          6. Detect rate limits: /api/ipc/route-history — 429 responses in last 5min?
          7. Detect compaction: context window near limit → auto checkpoint
          Classify each check as OK/WARN/CRITICAL via Mistral function calling.
          Store results in kernel_events table.
          On state change (OK→WARN, WARN→CRITICAL): trigger communicate().

      - id: T1-03
        title: "Verify gate — task completion evidence"
        type: feature
        description: |
          Hook into task update flow (POST /api/plan-db/task/update).
          Before marking task "done", kernel verifies:
          1. Declared output files exist (glob check on execution host via mesh)
          2. Tests pass (cargo test / npm test — exit code 0, run on execution host)
          3. Build succeeds (cargo check — exit code 0)
          4. No uncommitted changes in worktree (git status --porcelain)
          If any check fails, block task completion + communicate failure.
          Mistral classifies failure severity: retry vs escalate vs block.
          Evidence logged in kernel_verifications table with timestamp + check results.

      - id: T1-04
        title: "Recover actions — restart + checkpoint + notify"
        type: feature
        description: |
          On CRITICAL events, deterministic recovery chain:
          1. cvg checkpoint save <plan_id> (preserve state before any action)
          2. If daemon down on peer: SSH restart via mesh (bash daemon/start.sh serve --dev-mode &)
          3. If agent stalled: cvg reap (clean zombies)
          4. If worktree dirty: git stash + checkpoint
          5. Communicate via active channel (local audio or Telegram)
          On WARN events:
          1. Log to kernel_events
          2. Communicate only if WARN persists >3 cycles (90s)
          Recovery is DETERMINISTIC (if/else rules), not LLM-decided.
          The LLM only classifies the situation; the action is hardcoded.

      - id: T1-05
        title: "CLI: cvg kernel status/start/stop/logs/here"
        type: feature
        description: |
          cvg kernel status — model loaded, uptime, last check, event counts, active_node
          cvg kernel start — load model, start monitor loop
          cvg kernel stop — unload model, stop loop
          cvg kernel logs [--level WARN] — tail kernel_events table
          cvg kernel test — run all checks once, report results
          cvg kernel here — mark THIS node as active audio target
          cvg kernel say "testo" — force TTS, play on active node (debug/demo)

  - id: W2
    name: "Voice — TTS + STT + Audio Routing"
    tasks:
      - id: T2-01
        title: "Voxtral TTS integration"
        type: feature
        description: |
          Load Voxtral TTS 4B via MLX on kernel node (M1 Pro).
          POST /api/kernel/speak — takes {text, locale}, returns audio bytes (OGG/WAV).
          Default locale: it-IT.
          Caches common phrases (plan complete, daemon crash, etc.) to avoid re-synthesis.
          Latency target: <2s for a 20-word sentence.
          Audio format: OGG Opus (for Telegram compat) + WAV (for local playback).

      - id: T2-02
        title: "Audio routing — play on active mesh node"
        type: feature
        description: |
          Problem: Voxtral runs on M1 Pro, but user may be at M5 Max.
          Solution: kernel determines active node and streams audio there.

          Active node detection (priority order):
          1. Explicit: cvg kernel here — sets active_node in DB, valid 8h or until changed
          2. TTY detection: which peer has an active terminal session? (check /api/ipc/agents for agent with tty)
          3. Last interaction: which peer last received a cvg command? (from kernel_events)
          4. Fallback: kernel node itself (M1 Pro)

          Audio delivery:
          POST /api/kernel/play on target node — receives audio bytes, plays via:
          - macOS: afplay (WAV) or system `say` as ultimate fallback
          - Configurable: KERNEL_AUDIO_PLAYER=afplay

          Every daemon exposes /api/kernel/play (even without --kernel flag).
          Kernel node generates audio → POST to active node → local playback.

      - id: T2-03
        title: "Whisper STT integration"
        type: feature
        description: |
          Load Whisper small via MLX on kernel node.
          POST /api/kernel/transcribe — takes audio bytes, returns {text, locale, confidence}.
          POST /api/kernel/listen — start microphone recording on kernel node,
            stop on silence (>1.5s), transcribe, return text.

          For remote listening (user at M5 Max):
          cvg kernel listen — records audio LOCALLY (on the node where command is run),
            sends audio to kernel node /api/kernel/transcribe, gets text back.
          This means every node has a thin "record + send" client, but inference is on M1 Pro.

          Privacy: audio processed locally (M1 Pro), never sent to cloud, never stored on disk.
          Only the transcription text is logged (in kernel_events).

      - id: T2-04
        title: "Voice command router"
        type: feature
        description: |
          Mistral 3 8B classifies transcribed text into intent + params:
          {intent: "status_check", params: {scope: "all"}}
          {intent: "cost_query", params: {period: "today"}}
          {intent: "plan_query", params: {plan_id: 729}}
          {intent: "restart", params: {target: "m5"}}
          {intent: "unknown", params: {}}

          Supported intents:
          - status_check → cvg plan list + kernel status → speak summary
          - cost_query → cvg metrics cost → speak "Oggi hai speso 42 dollari"
          - plan_query → cvg plan show <id> → speak progress
          - restart → recover action on target node
          - silence / mute → stop speaking, ack
          - unknown → "Non ho capito. Prova con: stato, costi, piano, riavvia."

          Router: intent → daemon API call → format response text → Voxtral speaks → play on active node.
          NOT conversational. Strictly command-response. No memory of previous commands.

  - id: W3
    name: "Telegram — Bidirezionale testo + voce"
    tasks:
      - id: T3-01
        title: "Telegram Bot setup + outbound messages"
        type: feature
        description: |
          Telegram Bot via Bot API (HTTPS, no library dependency — just reqwest).
          Config: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID in env or config/telegram.yaml.
          chat_id = the user's personal chat (1:1 with bot, not a group).

          Outbound text:
          POST https://api.telegram.org/bot<token>/sendMessage
          {chat_id, text, parse_mode: "Markdown"}

          Outbound voice:
          1. Voxtral generates audio (OGG Opus format, required by Telegram)
          2. POST https://api.telegram.org/bot<token>/sendVoice
             multipart: chat_id + voice file (OGG)
          3. User receives voice note in Telegram — can listen with one tap.

          Notify rules (when to send Telegram vs local audio):
          - If active_node is reachable AND user set `cvg kernel here` recently → local audio
          - If no active_node OR active_node unreachable → Telegram
          - CRITICAL events → BOTH (local audio + Telegram)
          - User can override: KERNEL_NOTIFY=telegram|local|both

      - id: T3-02
        title: "Telegram inbound — text commands"
        type: feature
        description: |
          Receive messages via long polling (getUpdates, every 5s).
          Why polling over webhook: M1 Pro is behind NAT/Tailscale, no public IP.

          Inbound text → same intent classification as voice commands:
          User sends "stato" → kernel classifies → runs API → replies with text.
          User sends "costi oggi" → "Oggi hai speso 42 dollari su 3 piani."
          User sends "riavvia m5" → restart + confirm "M5 riavviato, daemon healthy."

          Markdown formatting in responses (Telegram supports it):
          *Piano 729* — Convergio Kernel
          Status: `doing` | 3/11 task done
          Prossimo: T2-01 Voxtral TTS

          Rate limit: max 1 response per second (Telegram API limit: 30 msg/s per bot).
          Auth: only respond to TELEGRAM_CHAT_ID. Ignore all other senders.

      - id: T3-03
        title: "Telegram inbound — voice messages"
        type: feature
        description: |
          User sends voice note in Telegram.
          1. Bot receives update with voice/audio message
          2. Download OGG file: GET https://api.telegram.org/bot<token>/getFile?file_id=...
          3. Convert OGG → WAV if needed (ffmpeg or native decoder)
          4. Send to Whisper: POST /api/kernel/transcribe
          5. Classify intent (same router as local voice commands)
          6. Execute command
          7. Reply with text + voice note (both)

          Full loop: user speaks into Telegram → kernel transcribes → acts → replies with voice.
          Same experience as local, but works anywhere in the world.

          Privacy: voice file downloaded, transcribed, then deleted. Only text logged.
          No voice stored on disk or in DB.

      - id: T3-04
        title: "Proactive Telegram reports"
        type: feature
        description: |
          Kernel sends periodic status without being asked:
          - Daily summary at 09:00: plans active, cost yesterday, agents used, events
          - On plan completion: "Piano X completato. Costo: Y. Durata: Z."
          - On CRITICAL: immediate alert with context
          - On wave merge: "Wave W1 del piano X mergiata. Prossima: W2."
          - Weekly digest (Sunday 20:00): cost breakdown, plans completed, learnings

          Format: text message + optional voice note (user configurable).
          Config: KERNEL_TELEGRAM_REPORTS=daily,critical,completion
          Quiet hours: KERNEL_QUIET_HOURS=23:00-07:00 (no audio, only text Telegram)

  - id: W4
    name: "Hardening + Integration Tests"
    tasks:
      - id: T4-01
        title: "Auto-start on M1 Pro boot"
        type: feature
        description: |
          launchd plist: com.convergio.kernel.plist
          Starts on login, restarts on crash (KeepAlive=true).
          Loads models sequentially: Mistral (10s) → Voxtral (5s) → Whisper (3s).
          Health check: wait for /api/kernel/status before declaring ready.
          Log to ~/Library/Logs/convergio-kernel.log (logrotate: 7 days, 50MB max).
          Telegram: send "Kernel avviato" on successful start.

      - id: T4-02
        title: "Integration tests — full cycle"
        type: test
        description: |
          Test monitor: simulate peer health failure → verify CRITICAL event + notification.
          Test verify: submit task "done" without output → verify blocked.
          Test recover: simulate crash → verify restart + checkpoint + Telegram alert.
          Test TTS: speak phrase → verify audio file valid (>0 bytes, correct format).
          Test STT: play audio → verify transcription matches expected.
          Test voice command: "stato" → verify API call + spoken response.
          Test audio routing: generate on M1 Pro → verify played on M5 Max (mock afplay).
          Test Telegram outbound: send text + voice → verify Bot API called correctly.
          Test Telegram inbound text: simulate "stato" message → verify response.
          Test Telegram inbound voice: simulate voice note → verify transcribe + respond.
          Performance: monitor loop <1s, TTS <2s, STT <3s, Telegram roundtrip <5s.

      - id: T4-03
        title: "ADR + docs + CHANGELOG"
        type: chore
        description: |
          ADR: "Convergio Kernel — local LLM watchdog with voice + Telegram"
          Decisions documented:
          - Why Mistral 3 8B: function calling, Apache 2.0, 5GB fits M1 Pro
          - Why MLX over Ollama: 20-30% faster on Apple Silicon
          - Why M1 Pro: always-on, low power, dedicated watchdog role
          - Why deterministic recovery: LLM classifies, rules act (no hallucination risk)
          - Why Telegram over other messengers: Bot API is simple HTTP, no SDK, OGG voice native
          - Why audio routing via mesh: user may be at any node, kernel is fixed on M1 Pro
          - Why Voxtral: same Mistral family, Italian support, 4B fits alongside 8B
          Update TROUBLESHOOTING.md: kernel section (model won't load, Telegram auth, audio routing).
          Update CHANGELOG.md.
          Update CLAUDE.md with kernel commands.

acceptance_invariants:
  - "cvg kernel status returns healthy on M1 Pro with all 3 models loaded"
  - "Monitor detects simulated peer failure within 60s"
  - "Verify blocks task without evidence"
  - "Recover restarts daemon via SSH and sends Telegram alert"
  - "TTS speaks Italian phrase in <2s"
  - "STT transcribes Italian command in <3s"
  - "Audio plays on active mesh node (not just kernel node)"
  - "cvg kernel here switches audio target"
  - "Telegram text command 'stato' gets correct response"
  - "Telegram voice note transcribed and answered with text + voice"
  - "All 3 models fit in <10GB RAM on M1 Pro 16GB"
  - "Auto-start via launchd works after reboot"
  - "Daily summary sent to Telegram at 09:00"
  - "CRITICAL events sent to BOTH local audio and Telegram"
  - "Quiet hours respected (no audio, text-only Telegram)"

estimates:
  W1_foundation: "2 days"
  W2_voice: "2 days"
  W3_telegram: "1.5 days"
  W4_hardening: "1 day"
  total: "~6.5 days"
