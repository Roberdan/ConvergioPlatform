          - active_node reachable + cvg kernel here recent → local audio
          - no active_node OR unreachable → Telegram
          - CRITICAL events → BOTH
          - Config override: KERNEL_NOTIFY=telegram|local|both
          - Quiet hours: KERNEL_QUIET_HOURS=23:00-07:00 → text Telegram only (no audio anywhere)

